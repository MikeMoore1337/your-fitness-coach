# Запуск: pip install pre-commit && pre-commit install
# Все файлы: pre-commit run --all-files
#
# Ruff закрывает автофикс, сортировку импортов (isort), lint (flake8-подобные правила)
# и форматирование (black-совместимый ruff-format). Настройки живут в pyproject.toml.

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix", "--no-cache"]
        files: ^(backend/(fitminiapp_api|tests)|bot|tests|scripts)/.*\.py$
      - id: ruff-format
        args: ["--no-cache"]
        files: ^(backend/(fitminiapp_api|tests)|bot|tests|scripts)/.*\.py$

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend package)
        entry: python scripts/run_mypy.py
        language: python
        additional_dependencies:
          - mypy==2.3.0
        pass_filenames: false
        files: ^(backend/fitminiapp_api|scripts/run_mypy\.py|pyproject\.toml)
