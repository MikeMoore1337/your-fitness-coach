[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-mini-app"
version = "0.1.0"
description = "Telegram Mini App для тренировок: FastAPI, мини-приложение, бот"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
backend = [
    "fastapi",
    "msgpack>=1.2.1",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "pydantic",
    "alembic",
    "authlib",
    "cryptography",
    "PyJWT",
    "pwdlib[argon2]",
    "httpx[socks]",
    "pywebpush==2.5.0",
    "itsdangerous",
    "python-multipart",
    "qrcode[pil]",
    "reportlab",
    "setuptools>=78.1.1",
    "slowapi",
    "onnxruntime==1.30.0",
    "rapidocr==3.9.2",
]
bot = [
    "aiogram",
    "aiohttp-socks",
    "httpx",
    "pydantic-settings",
    "tzdata",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-xdist",
    "ruff>=0.16.1",
]
scheduled-report = [
    "allure-pytest==2.16.1",
]

[tool.uv]
package = false
default-groups = []
required-version = ">=0.11.32,<0.12"
# Starlette 1.6 still references the deprecated anyio.abc.BlockingPortal alias; pytest treats it as an error.
constraint-dependencies = ["anyio>=4.14.2,<4.15"]

# Backend и bot имеют уникальные имена пакетов, чтобы локальные инструменты типизации
# не зависели от порядка PYTHONPATH.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend", "bot", "tests", "scripts"]
cache-dir = ".artifacts/runtime/cache/ruff"
# Historical Alembic revisions are immutable deployment artifacts. New application
# code and tests remain covered by Ruff through pre-commit and CI.
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF003",
    # FastAPI: Depends() в аргументах по умолчанию — нормальный паттерн.
    "B008",
    # HTTPException из except — без цепочки исключений, типично для API.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fitminiapp_api", "fitminiapp_bot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = false
cache_dir = ".artifacts/runtime/cache/mypy"
mypy_path = "backend"
explicit_package_bases = true
packages = ["fitminiapp_api"]
exclude = ["^backend/alembic/"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false

[tool.pytest.ini_options]
cache_dir = ".artifacts/runtime/cache/pytest"
addopts = "--basetemp=.artifacts/runtime/tests/pytest-tmp"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
]

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*"]
ignore_errors = true

# pydantic-settings: значения приходят из env при рантайме.
[[tool.mypy.overrides]]
module = ["fitminiapp_api.core.config"]
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = ["bot.fitminiapp_bot.config"]
disable_error_code = ["call-arg"]
