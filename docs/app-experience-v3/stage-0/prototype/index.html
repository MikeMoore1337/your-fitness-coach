<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111512" />
    <title>YFC · App Experience v3 · Stage 0</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="prototype-app" data-direction="command" data-theme="light">
      <header class="prototype-header">
        <a
          class="brand-lockup"
          href="?screen=today"
          aria-label="YFC, на главный экран прототипа"
        >
          <span class="brand-mark" aria-hidden="true">Y</span>
          <span>
            <strong>YFC</strong>
            <small>App Experience v3 · Stage 0</small>
          </span>
        </a>
        <div class="header-actions">
          <span class="prototype-badge">локальный прототип</span>
          <button
            class="icon-button"
            type="button"
            id="themeToggle"
            aria-label="Переключить тему"
          >
            <span aria-hidden="true">◐</span>
            <span class="sr-only">Тема</span>
          </button>
        </div>
      </header>

      <div class="prototype-layout">
        <aside class="desktop-rail" aria-label="Навигация прототипа">
          <div id="railContext"></div>
          <nav class="rail-nav" id="railNav"></nav>
          <div class="rail-footnote">
            <span class="status-dot" aria-hidden="true"></span>
            Данные статичны и не записываются
          </div>
        </aside>

        <main class="prototype-main" id="mainContent" tabindex="-1"></main>
      </div>

      <nav
        class="mobile-nav"
        id="mobileNav"
        aria-label="Мобильная навигация"
      ></nav>
    </div>
  </body>
</html>
