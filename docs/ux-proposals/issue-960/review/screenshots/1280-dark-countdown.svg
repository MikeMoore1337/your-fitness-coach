<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Issue #960 dark countdown baseline-preserving RestTimer mockup</title><desc id="desc">Действующий RestTimer с обратным счётчиком 0:48, фактическим временем Факт 0:42, кнопкой Завершить отдых и существующими действиями плюс тридцать, плюс шестьдесят и Пропустить.</desc><rect width="1280" height="720" fill="#090b0b"/><rect x="0" y="0" width="1280" height="44" fill="#111512"/><text x="300" y="26" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ТЕКУЩАЯ ТРЕНИРОВКА</text><text x="300" y="45" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">Отдых между подходами</text><rect x="300" y="58" width="680" height="178" rx="12" fill="#1a1f1b" stroke="#424b44"/><text x="314" y="85" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ОТДЫХ</text><text x="314" y="111" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="750" text-anchor="start">0:48</text><text x="314" y="135" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="start">Факт 0:42</text><text x="416" y="108" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" text-anchor="start">Далее: Тяга верхнего блока</text><text x="416" y="143" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">2-й подход</text><rect x="828" y="70" width="138" height="44" rx="9" fill="#293719" stroke="#b2f520"/><text x="897" y="97" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="750" text-anchor="middle">Завершить отдых</text><rect x="314" y="170" width="212" height="44" rx="9" fill="none" stroke="#424b44"/><text x="420" y="197" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">+30 сек</text><rect x="534" y="170" width="212" height="44" rx="9" fill="none" stroke="#424b44"/><text x="640" y="197" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">+60 сек</text><rect x="754" y="170" width="212" height="44" rx="9" fill="none" stroke="#424b44"/><text x="860" y="197" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">Пропустить</text><rect x="300" y="258" width="680" height="260" rx="12" fill="#151a16" stroke="#424b44"/><text x="314" y="286" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">СЛЕДУЮЩИЙ ПОДХОД</text><text x="314" y="310" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" text-anchor="start">Тяга верхнего блока</text><text x="314" y="332" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">3 × 10 · 42 кг · RIR 2</text><line x1="314" y1="363" x2="966" y2="363" stroke="#424b44"/><text x="314" y="390" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">Вес</text><text x="630" y="390" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" text-anchor="end">42 кг</text><text x="660" y="390" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">Повторы</text><text x="966" y="390" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" text-anchor="end">10</text><text x="314" y="436" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="400" text-anchor="start">Следующий подход начинается отдельным действием пользователя.</text><rect x="190" y="648" width="900" height="72" rx="12" fill="#1a1f1b" stroke="#424b44"/><rect x="194" y="658" width="172" height="48" rx="9" fill="#293719" stroke="none"/><text x="280" y="687" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="800" text-anchor="middle">Тренировка</text><text x="460" y="687" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Прогресс</text><text x="640" y="687" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Питание</text><text x="820" y="687" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Библиотека</text><text x="1000" y="687" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Профиль</text></svg>
