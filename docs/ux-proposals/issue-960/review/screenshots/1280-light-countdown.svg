art">Вес</text><text x="630" y="390" fill="#171b18" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" text-anchor="end">42 кг</text><text x="660" y="390" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">Повторы</text><text x="966" y="390" fill="#171b18" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" text-anchor="end">10</text><text x="314" y="436" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="400" text-anchor="start">Следующий подход начинается отдельным действием пользователя.</text><rect x="190" y="648" width="900" height="72" rx="12" fill="#ffffff" stroke="#c9d0c9"/><rect x="194" y="658" width="172" height="48" rx="9" fill="#e9f4cf" stroke="none"/><text x="280" y="687" fill="#486414" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="800" text-anchor="middle">Тренировка</text><text x="460" y="687" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Прогресс</text><text x="640" y="687" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Питание</text><text x="820" y="687" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Библиотека</text><text x="1000" y="687" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Профиль</text></svg>
