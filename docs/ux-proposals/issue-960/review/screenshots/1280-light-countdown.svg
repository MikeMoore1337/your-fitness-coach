<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Issue #960 light countdown baseline-preserving RestTimer mockup</title><desc id="desc">Действующий RestTimer с обратным счётчиком 0:48, фактическим временем Факт 0:42, кнопкой Завершить отдых и существующими действиями плюс тридцать, плюс шестьдесят и Пропустить.</desc><rect width="1280" height="720" fill="#edf0eb"/><rect x="0" y="0" width="1280" height="44" fill="#f7f9f5"/><text x="300" y="26" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ТЕКУЩАЯ ТРЕНИРОВКА</text><text x="300" y="45" fill="#171b18" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">Отдых между подходами</text><rect x="300" y="58" width="680" height="178" rx="12" fill="#ffffff" stroke="#c9d0c9"/><text x="314" y="85" fill="#171b18" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ОТДЫХ</text><text x="314" y="111" fill="#171b18" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="750" text-anchor="start">0:48</text><text x="314" y="135" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="start">Факт 0:42</text><text x="416" y="108" fill="#171b18" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" text-anchor="start">Далее: Тяга верхнего блока</text><text x="416" y="143" fill="#59615b" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">2-й подход</text><rect x="828" y="70" widt