<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Issue #960 dark overtime baseline-preserving RestTimer mockup</title><desc id="desc">Действующий RestTimer: плановый обратный счётчик слева, контекст Далее, фактически измеренный интервал и компактное действие Стоп справа, существующие действия плюс тридцать, плюс шестьдесят и Пропустить в текущем ряду.</desc><defs><clipPath id="next-copy-1280-dark-overtime"><rect x="380" y="68" width="209" height="44"/></clipPath></defs><rect width="1280" height="720" fill="#090b0b"/><rect x="0" y="0" width="1280" height="44" fill="#111512"/><text x="300" y="26" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ТЕКУЩАЯ ТРЕНИРОВКА</text><text x="300" y="45" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">Отдых между подходами</text><rect x="300" y="58" width="680" height="64" rx="12" fill="#1a1f1b" stroke="#424b44"/><text x="310" y="85" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ОТДЫХ</text><text x="310" y="107" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="750" text-anchor="start">0:00</text><text x="380" y="80" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="800" text-anchor="start">ПЛАН ЗАВЕРШЁН</text><g clip-path="url(#next-copy-1280-dark-overtime)"><text x="380" y="95" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650" text-anchor="start">Далее: Тяга верхнего блока — повторный тяжёлы