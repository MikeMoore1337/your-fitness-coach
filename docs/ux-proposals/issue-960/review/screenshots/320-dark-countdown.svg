<svg xmlns="http://www.w3.org/2000/svg" width="320" height="760" viewBox="0 0 320 760" role="img" aria-labelledby="title desc"><title id="title">Issue #960 dark countdown baseline-preserving RestTimer mockup</title><desc id="desc">Действующий RestTimer: плановый обратный счётчик слева, контекст Далее, фактически измеренный интервал и компактное действие Стоп справа, существующие действия плюс тридцать, плюс шестьдесят и Пропустить в текущем ряду.</desc><defs><clipPath id="next-copy-320-dark-countdown"><rect x="82" y="66" width="131" height="44"/></clipPath></defs><rect width="320" height="760" fill="#090b0b"/><rect x="0" y="0" width="320" height="44" fill="#111512"/><text x="8" y="26" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ТЕКУЩАЯ ТРЕНИРОВКА</text><text x="8" y="45" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">Отдых между подходами</text><rect x="8" y="58" width="304" height="110" rx="12" fill="#1a1f1b" stroke="#424b44"/><text x="18" y="83" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ОТДЫХ</text><text x="18" y="105" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="750" text-anchor="start">0:48</text><g clip-path="url(#next-copy-320-dark-countdown)"><text x="82" y="91" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650" text-anchor="start">Далее: Тяга верхнего блока — повторный тяжёлый подход</text><text x="82" y="106" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">2-й подход</text