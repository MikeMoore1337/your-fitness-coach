<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">Issue #960 dark overtime baseline-preserving RestTimer mockup</title><desc id="desc">Действующий RestTimer с обратным счётчиком 0:00, фактическим временем Факт 2:14, кнопкой Завершить отдых и существующими действиями плюс тридцать, плюс шестьдесят и Пропустить.</desc><rect width="360" height="760" fill="#090b0b"/><rect x="0" y="0" width="360" height="42" fill="#111512"/><text x="8" y="26" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ТЕКУЩАЯ ТРЕНИРОВКА</text><text x="8" y="45" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">Отдых между подходами</text><rect x="8" y="56" width="344" height="226" rx="12" fill="#1a1f1b" stroke="#424b44"/><text x="22" y="83" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ОТДЫХ</text><text x="22" y="109" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="750" text-anchor="start">0:00</text><text x="22" y="133" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="start">Факт 2:14</text><text x="116" y="79" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ПЛАН ЗАВЕРШЁН</text><text x="116" y="96" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" text-anchor="start">План завершён</text><text x="116" y="120" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" text-anchor="start">Далее: Тяга верхнего блока</text><text x="116" y="138" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">2-й подход</text><rect x="22" y="154" width="316" height="44" rx="9" fill="#293719" stroke="#b2f520"/><text x="180" y="181" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="750" text-anchor="middle">Завершить отдых</text><rect x="22" y="210" width="100" height="44" rx="9" fill="none" stroke="#424b44"/><text x="72" y="237" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">+30 сек</text><rect x="130" y="210" width="100" height="44" rx="9" fill="none" stroke="#424b44"/><text x="180" y="237" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">+60 сек</text><rect x="238" y="210" width="100" height="44" rx="9" fill="none" stroke="#424b44"/><text x="288" y="237" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">Пропустить</text><rect x="8" y="304" width="344" height="210" rx="12" fill="#151a16" stroke="#424b44"/><text x="22" y="332" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">СЛЕДУЮЩИЙ ПОДХОД</text><text x="22" y="356" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" text-anchor="start">Тяга верхнего блока</text><text x="22" y="378" fill="#a9b0aa" font-family="Inter,system-ui,-