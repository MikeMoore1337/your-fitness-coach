<svg xmlns="http://www.w3.org/2000/svg" width="430" height="760" viewBox="0 0 430 760" role="img" aria-labelledby="title desc"><title id="title">Issue #960 dark countdown baseline-preserving RestTimer mockup</title><desc id="desc">Действующий RestTimer с обратным счётчиком 0:48, фактическим временем Факт 0:42, кнопкой Завершить отдых и существующими действиями плюс тридцать, плюс шестьдесят и Пропустить.</desc><rect width="430" height="760" fill="#090b0b"/><rect x="0" y="0" width="430" height="42" fill="#111512"/><text x="8" y="26" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ТЕКУЩАЯ ТРЕНИРОВКА</text><text x="8" y="45" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">Отдых между подходами</text><rect x="8" y="56" width="414" height="226" rx="12" fill="#1a1f1b" stroke="#424b44"/><text x="22" y="83" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">ОТДЫХ</text><text x="22" y="109" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="750" text-anchor="start">0:48</text><text x="22" y="133" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="start">Факт 0:42</text><text x="116" y="106" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" text-anchor="start">Далее: Тяга верхнего блока</text><text x="116" y="141" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">2-й подход</text><rect x="22" y="154" width="386" height="44" rx="9" fill="#293719" stroke="#b2f520"/><text x="215" y="181" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="750" text-anchor="middle">Завершить отдых</text><rect x="22" y="210" width="123.33333333333333" height="44" rx="9" fill="none" stroke="#424b44"/><text x="83.66666666666666" y="237" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">+30 сек</text><rect x="153.33333333333331" y="210" width="123.33333333333333" height="44" rx="9" fill="none" stroke="#424b44"/><text x="214.99999999999997" y="237" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">+60 сек</text><rect x="284.66666666666663" y="210" width="123.33333333333333" height="44" rx="9" fill="none" stroke="#424b44"/><text x="346.3333333333333" y="237" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" text-anchor="middle">Пропустить</text><rect x="8" y="304" width="414" height="210" rx="12" fill="#151a16" stroke="#424b44"/><text x="22" y="332" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="800" text-anchor="start">СЛЕДУЮЩИЙ ПОДХОД</text><text x="22" y="356" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" text-anchor="start">Тяга верхнего блока</text><text x="22" y="378" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">3 × 10 · 42 кг · RIR 2</text><line x1="22" y1="409" x2="408" y2="409" stroke="#424b44"/><text x="22" y="436" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">Вес</text><text x="205" y="436" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" text-anchor="end">42 кг</text><text x="235" y="436" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">Повторы</text><text x="408" y="436" fill="#f4f6f2" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" text-anchor="end">10</text><text x="22" y="482" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="400" text-anchor="start">Следующий подход начинается отдельным действием пользователя.</text><rect x="0" y="688" width="430" height="72" rx="12" fill="#1a1f1b" stroke="#424b44"/><rect x="4" y="698" width="78" height="48" rx="9" fill="#293719" stroke="none"/><text x="43" y="727" fill="#b2f520" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="800" text-anchor="middle">Тренировка</text><text x="129" y="727" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Прогресс</text><text x="215" y="727" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Питание</text><text x="301" y="727" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Библиотека</text><text x="387" y="727" fill="#a9b0aa" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">Профиль</text></svg>
