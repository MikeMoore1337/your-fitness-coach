<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="title desc">
  <title id="title">Issue 960, вариант B, Light</title>
  <desc id="desc">Светлый статический макет панели, где до нуля главным является план, а после нуля — фактическое elapsed-время.</desc>
