  <text x="38" y="68" fill="#161a17" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800">Приоритет фазы без смены геометрии</text>
  <text x="38" y="91" fill="#59605b" font-family="Inter, system-ui, sans-serif" font-size="12">Синтетические данные · после нуля крупным остаётся только факт</text>

