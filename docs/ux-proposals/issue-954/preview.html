    .insight{background:var(--v2-surface-secondary);border-radius:14px;padding:14px 16px;margin:16px 0}.insight p:first-child{margin-top:0}.insight p:last-child{margin-bottom:0}.dayline{display:flex;gap:6px;margin:14px 0 6px}.day{flex:1;text-align:center;padding:9px 2px;border:1px solid var(--v2-border);border-radius:12px;min-width:0}.day b,.day span{display:block;font-size:12px}.day span{color:var(--v2-text-secondary)}.day.complete{background:var(--v2-surface-secondary)}.day.selected{box-shadow:var(--v2-selected-relief);background:var(--v2-selected-surface)}
    .button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:10px 17px;border-radius:14px;border:1px solid var(--v2-border-strong);background:transparent;color:var(--v2-text-primary);font-weight:700;text-decoration:none}.button.primary{background:var(--v2-lime);color:var(--v2-on-lime);border-color:var(--v2-lime)}.button:disabled{opacity:.52;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{display:inline-block;padding:4px 10px;border:1px solid var(--v2-border);border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.status.good{color:var(--v2-success-text);border-color:var(--v2-success-border)}.notice{border:1px solid var(--v2-border-strong);border-radius:14px;padding:14px;margin:14px 0}.notice.warning{border-color:var(--v2-warning);background:var(--v2-warning-surface)}.notice.error{border-color:var(--v2-danger);background:var(--v2-danger-surface)}.notice strong{display:block}.notice p{margin:4px 0}.rows{border-top:1px solid var(--v2-border);margin-top:14px}.row{display:flex;justify-content:space-between;align-items:start;gap:18px;padding:12px 0;border-bottom:1px solid var(--v2-border)}.row span:last-child{text-align:right}.table-wrap{overflow-x:auto}.comparison{border-collapse:collapse;width:100%;min-width:300px;font-size:14px;font-variant-numeric:tabular-nums}.comparison th,.comparison td{padding:10px 4px;border-bottom:1px solid var(--v2-border);text-align:right}.comparison th:first-child,.comparison td:first-child{text-align:left}.comparison th{font-size:12px;color:var(--v2-text-secondary);font-weight:600}.change{color:var(--v2-accent-text);font-weight:700}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.field{display:grid;gap:5px;font-size:13px;font-weight:700}.field input,.field select{width:100%;min-width:0;min-height:44px;padding:9px 11px;border:1px solid var(--v2-border-strong);border-radius:12px;background:var(--v2-surface);col <body>
<div class="review-tools"><label for="state">Состояние макета</label><select id="state"></select><button class="button" id="theme" type="button">Сменить тему</button><span class="small">Прототип: данные вымышлены; поля примера не пересчитывают сравнение и не сохраняются</span></div>
<div class="shell"><header class="top"><div class="brand">YOUR FITNESS COACH</div><div class="workspace" id="workspace"></div></header><div id="app"></div></div>
<nav class="dock" aria-label="Навигация в макете"></nav>
<script>
const states = {
  report:'Тренер · отчёт', edit:'Тренер · подготовка', review:'Тренер · проверка и отправка', sent:'Тренер · ожидает ответа', athlete:'Клиент · предложение', accepted:'Клиент · принято', rejected:'Клиент · отклонено', coachAccepted:'Тренер · принято', coachRejected:'Тренер · отклонено', stale:'Изменились данные', revoked:'Нет доступа', empty:'Нет цели и данных', loading:'Загрузка', error:'Ошибка загрузки', program:'Изменилась программа', clients:'Список клиентов'
};
const params = new URLSearchParams(location.search);
document.documentElement.dataset.colorScheme = params.get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.dataset.capture = params.get('capture') === '1' ? 'true' : 'false';
const picker = document.querySelector('#state');
picker.innerHTML = Object.entries(states).map(([key,label]) => `<option value="${key}">${label}</option>`).join('');
const intro = `<div class="breadcrumb">Клиенты / Анна Смирнова / Питание</div><div class="page-head"><div><div class="overline">Клиент · активная связь</div><h1>Питание Анны</h1><p>Отчёт, план и предложения в одном месте</p></div></div>`;
const athleteIntro = `<div class="breadcrumb">Питание / Предложение тренера</div><div class="page-head"><div><div class="overline">Ваш план питания</div><h1>Предложение тренера</h1><p>Проверьте изменения и выберите решение</p></div></div>`;
const comparison = `<div class="table-wrap"><table class="comparison"><thead><tr><th scope="col">На день</th><th scope="col">Сейчас</th><th scope="col">Предлагается</th></tr></thead><tbody><tr><th scope="row">Энергия</th><td>2 000 ккал</td><td><span class="change">2 100 ккал</span></td></tr><tr><th scope="row">Белки</th><td>110 г</td><td><span class="change">125 г</span></td></tr><tr><th scope="row">Жиры</th><td>70 г</td><td>70 г</td></tr><tr><th scope="row">Углеводы</th><td>230 г</td><td>240 г</td></tr></tbody></table></div><p class="small">Цели на 18 ноября · действующая версия от 2 ноября</p><hr class="rule"><h3>Приём пищи · перекус</h3><div class="row"><span>Сейчас<br><span class="small">Творог · 100 г</span></span><span>Предлагается<br><strong>Творог · 150 г</strong></span></div><p class="small">Пищевая ценность перекуса рассчитана по сохранённому продукту. Неизвестные значения показаны как «—».</p>`;
const aside = `<aside class="aside"><h2>О клиенте</h2><p><strong>Анна Смирнова</strong><br><span class="small">Время клиента: Москва</span></p><hr class="rule"><p class="small">Сравнение учитывает цель каждого дня. Прошедшие и завершённые дни останутся без изменений.</p><p class="small">Данные примера вымышлены.</p></aside>`;
const report = `<section class="panel"><div class="heading-row"><div><div class="overline">Отчёт о питании</div><h2>Последние 7 дней</h2><p class="small">9–15 ноября · время клиента</p></div><span class="status">5 из 7 дней</span></div><div class="period" aria-label="Период отчёта"><button class="choice" type="button">День</button><button class="choice selected" type="button" aria-pressed="true">7 дней</button><button class="choice" type="button">30 дней</button></div><div class="dayline" aria-label="Дни отчёта"><div class="day complete"><b>Пн</b><span>9</span></div><div class="day complete"><b>Вт</b><span>10</span></div><div class="day complete"><b>Ср</b><span>11</span></div><div class="day complete"><b>Чт</b><span>12</span></div><div class="day complete"><b>Пт</b><span>13</span></div><div class="day"><b>Сб</b><span>14</span></div><div class="day"><b>Вс</b><span>15</span></div></div><p class="small">5 завершено · 1 не завершён · 1 нет данных</p><div class="metrics"><div class="metric"><span>Энергия · в среднем</span><strong>1 850</strong><span>ккал / день</span></div><div class="metric"><span>Белки</span><strong>92 г</strong><span>в среднем / день</span></div><div class="metric"><span>Жиры</span><strong>68 г</strong><span>в среднем / день</span></div><div class="metric"><span>Углеводы</span><strong>—</strong><span>недостаточно данных</span></div></div><div class="insight"><strong>Белки ниже цели в 4 из 5 дней</strong><p>Сравнение использует цель, действовавшую в каждый завершённый день. Неполный день и день без записей не включены.</p><p class="small">Это наблюдение по дневнику, а не медицинский вывод.</p></div></section><section class="panel"><h2>Назначено и запланировано</h2><div class="row"><span>Цель на 18 ноября<br><span class="small">Версия от 2 ноября</span></span><span class="numbers">2 000 ккал<br><span class="small">Б 110 · Ж 70 · У 230 г</span></span></div><div class="row"><span>Тренировочная программа<br><span class="small">18 ноября · тренировка</span></span><span>Цель назначена</span></div><div class="row"><span>План питания<br><span class="small">18 ноября · 4 приёма пищи</span></span><span>Запланировано</span></div><div class="actions"><button class="button" type="button" data-go="history">История целей</button><button class="button primary" type="button" data-go="edit">Предложить изменение</button></div><div id="history" class="notice" hidden><strong>История целей</strong><p>С 2 ноября · 2 000 ккал · Б 110 · Ж 70 · У 230 г</p><p>С 20 октября по 1 ноября · 1 900 ккал · Б 105 · Ж 65 · У 220 г</p></div></section>`;
const edit = `<section class="panel"><div class="overline">Новое предложение</div><h2>Изменить будущий план</h2><p class="small">Анна увидит сравнение и сама примет или отклонит предложение. До её решения ничего не изменится.</p><div class="fields"><label class="field">Дата действия<input type="date" value="2026-11-18"><small>Только будущая дата по времени клиента</small></label><label class="field">Энергия, ккал<input type="number" value="2100"></label><label class="field">Белки, г<input type="number" value="125"></label><label class="field">Жиры, г<input type="number" value="70"></label><label class="field">Углеводы, г<input type="number" value="240"></label></div><hr class="rule"><h3>План на 18 ноября</h3><div class="row"><span>Перекус<br><span class="small">Творог · сейчас 100 г</span></span><label class="field">Предлагается, г<input type="number" value="150" style="width:100px"></label></div><label class="field" style="margin-top:14px">Комментарий клиенту <small>Необязательно</small><input type="text" value="Посмотри, подходит ли тебе такой вариант"></label><div class="actions"><button class="button" data-go="report">Отмена</button><button class="button primary" data-go="review">Проверить изменения</button></div></section>`;
const review = `<section class="panel"><div class="heading-row"><div><div class="overline">Проверка перед отправкой</div><h2>Что увидит Анна</h2><p class="small">Предложение на 18 ноября · по времени клиента</p></div><span class="status">Черновик</span></div>${comparison}<div class="notice"><strong>План ещё не изменён</strong><p>Изменения вступят в силу только после принятия клиентом. Прошлые дни и дневник сохранятся.</p></div><p><strong>Комментарий:</strong> Посмотри, подходит ли тебе такой вариант.</p><div class="actions"><button class="button" data-go="edit">Вернуться к изменениям</button><button class="button primary" data-go="sent">Отправить предложение</button></div></section>`;
function outcome(kind,coach=false){let accepted=kind==='accepted';return `<section class="panel"><div class="heading-row"><div><div class="overline">Предложение на 18 ноября</div><h2>${accepted?'Предложение принято':'Предложение отклонено'}</h2><p class="small">${coach?'Решение клиента':'Ваше решение'} · 17 ноября, 14:30</p></div><span class="status ${accepted?'good':''}">${accepted?'Принято':'Отклонено'}</span></div><div class="notice"><strong>${accepted?'Будущий план обновлён':'План не изменён'}</strong><p>${accepted?'Новые значения действуют на 18 ноября. История и завершённые дни не изменились.':'Действующие цели и приёмы пищи сохранены.'}</p></div>${comparison}<div class="actions"><button class="button" data-go="${coach?'report':'athlete'}">${coach?'К отчёту клиента':'К питанию'}</button></div></section>`}
const views = {
 report, edit, review, clients:`<section class="panel"><h2>Клиенты</h2><p>Выберите клиента, чтобы открыть его карточку.</p></section>`,
 sent:`<section class="panel"><div class="heading-row"><div><div class="overline">Предложение на 18 ноября</div><h2>Ожидает ответа Анны</h2><p class="small">Отправлено 17 ноября · план пока не изменён</p></div><span class="status">Ожидает ответа</span></div>${comparison}<div class="actions"><button class="button" data-go="report">К отчёту клиента</button></div></section>`,
 athlete:`<section class="panel"><div class="heading-row"><div><div class="overline">От тренера · Ирина Волкова</div><h2>Изменения на 18 ноября</h2><p class="small">Получено 17 ноября · ваше время: Москва</p></div><span class="status">Ждёт решения</span></div><p>Посмотри, подходит ли тебе такой вариант.</p>${comparison}<div class="notice"><strong>Решать вам</strong><p>До принятия план не изменится. Если отклонить предложение, действующий план сохранится.</p></div><div class="actions"><button class="button primary" data-go="accepted">Принять изменения</button><button class="button" data-go="rejected">Отклонить</button></div></section>`,
 accepted:outcome('accepted'),rejected:outcome('rejected'),coachAccepted:outcome('accepted',true),coachRejected:outcome('rejected',true),
 stale:`<section class="panel"><div class="overline">Предложение на 18 ноября</div><h2>Данные изменились</h2><div class="notice warning"><strong>Нужно проверить предложение заново</strong><p>После подготовки изменилась цель или план на эту дату. Ничего не применено.</p></div>${comparison}<div class="actions"><button class="button primary" data-go="report">Вернуться к актуальным данным</button></div></section>`,
 revoked:`<section class="panel"><div class="overline">Питание клиента</div><h2>Доступ к питанию закрыт</h2><div class="notice"><strong>Данные и предложения недоступны</strong><p>Связь или разрешение изменились. Обратитесь к клиенту, чтобы уточнить доступ.</p></div><button class="button" data-go="clients">К списку клиентов</button></section>`,
 empty:`<section class="panel"><div class="overline">Отчёт о питании</div><h2>Пока недостаточно данных</h2><p>За выбранный период нет завершённых дней. Сравнить фактическое питание с целью пока нельзя.</p><div class="notice"><strong>Цель на 18 ноября не задана</strong><p>Отсутствующая цель не считается нулём. Историю и доступный план можно проверить отдельно.</p></div><div class="actions"><button class="button" data-go="report">Изменить период</button><button class="button primary" data-go="edit">Предложить цель</button></div></section>`,
 loading:`<section class="panel" aria-busy="true"><div class="overline">Отчёт о питании</div><h2>Загружаем данные</h2><p class="small">Это может занять несколько секунд.</p></section>`,
 error:`<section class="panel"><div class="overline">Отчёт о питании</div><h2>Не удалось загрузить данные</h2><div class="notice error"><strong>Проверьте соединение</strong><p>Данные не изменены. Попробуйте ещё раз.</p></div><button class="button primary" data-go="report">Повторить</button></section>`,
 program:`<section class="panel"><div class="overline">Тренировочная программа</div><h2>Программа изменилась</h2><div class="notice warning"><strong>План питания не менялся</strong><p>Программа обновлена после назначения цели. Проверьте будущие даты перед новым предложением.</p></div><div class="row"><span>18 ноября<br><span class="small">Текущая программа</span></span><span>День отдыха</span></div><div class="row"><span>Цель питания<br><span class="small">Последнее назначение</span></span><span>Тренировочный день</span></div><div class="actions"><button class="button" data-go="report">К отчёту</button><button class="button primary" data-go="edit">Подготовить предложение</button></div></section>`
};
function show(name){if(!states[name])name='report';const athlete=['athlete','accepted','rejected'].includes(name);picker.value=name;document.querySelector('#workspace').textContent=athlete?'Для себя · Питание':'Для тренера · Клиенты';document.querySelector('.dock').innerHTML=athlete?'<span>Сегодня</span><span>План</span><span class="current">Питание</span><span>Прогресс</span><span>Добавить</span>':'<span>Сегодня</span><span class="current">Клиенты</span><span>Программы</span><span>Ещё</span>';document.querySelector('#app').innerHTML=(['clients','revoked'].includes(name)?'<div class="page-head"><div><div class="overline">Для тренера</div><h1>Клиенты</h1></div></div>':athlete?athleteIntro:intro)+`<div class="layout"><main class="main">${views[name]}</main>${athlete?'<aside class="aside"><h2>Ваше решение</h2><p class="small">Тренер увидит, принято или отклонено предложение. До решения ваш план не меняется.</p></aside>':['clients','revoked'].includes(name)?'':aside}</div>`;document.title=states[name]+' — макет #954'}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]')?.dataset.go;if(go==='history'){const h=document.querySelector('#history');h.hidden=!h.hidden}else if(go){show(go);window.scrollTo(0,0)}});
picker.addEventListener('change',()=>show(picker.value));document.querySelector('#theme').addEventListener('click',()=>{document.documentElement.dataset.colorScheme=document.documentElement.dataset.colorScheme==='dark'?'light':'dark'});show(params.get('state')||'report');
</script>
