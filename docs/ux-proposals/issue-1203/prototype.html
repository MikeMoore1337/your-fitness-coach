<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>1203 — профили оборудования</title>
<style>
@font-face{font-family:Inter;src:url('../../../frontend/public/assets/fonts/inter-cyrillic.woff2')}@font-face{font-family:Oswald;src:url('../../../frontend/public/assets/fonts/oswald-cyrillic.woff2')}
*{box-sizing:border-box}html{color-scheme:dark;--bg:#090b0b;--panel:#121515;--soft:#1b1f1f;--border:#404646;--text:#f5f5f5;--muted:#b8b8b8;--lime:#b1ef13;--accent-text:#b9ea72;--choice:linear-gradient(180deg,#3b4436,#2a3028);--choice-border:#778e55;--input:#131616;--dock:rgba(31,36,36,.94)}
html[data-theme=light]{color-scheme:light;--bg:#fff;--panel:#fff;--soft:#f0f0f0;--border:#d1d1d1;--text:#151515;--muted:#606060;--lime:#b1ef13;--accent-text:#486414;--choice:linear-gradient(180deg,#f7ffe8,#dbeeb7);--choice-border:#758b50;--input:#fff;--dock:rgba(246,248,247,.94)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:15px;line-height:1.38}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Oswald,Arial,sans-serif}h1{font-size:35px;line-height:1.13}h2{font-size:22px;line-height:1.2}h3{font-size:18px;line-height:1.2}small,.muted{color:var(--muted)}small{font-size:12px}button,input{font:inherit}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}button{cursor:pointer}a{color:inherit}button,.button{min-height:44px;border-radius:13px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:10px 14px;font-weight:700;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;text-align:center}button.primary,.button.primary{background:var(--lime);border-color:var(--lime);color:#101510}button.text,.button.text{border:0;background:transparent;color:var(--accent-text);padding:8px 0;min-height:40px}input[type=text],input[type=search]{width:100%;height:46px;padding:0 13px;border:1px solid var(--border);border-radius:13px;background:var(--input);color:var(--text)}input[type=checkbox],input[type=radio]{accent-color:#9ee900;width:18px;height:18px;flex:none;margin:0}
.shell{max-width:1600px;margin:auto}.sidebar{display:none}.mobile-header{height:65px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}.logo{width:42px;max-height:44px}.lockup{display:flex;align-items:center;gap:7px}.lockup b{font-size:10px;line-height:1.1;letter-spacing:.04em}.avatar{border:2px solid #a2ee00;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:13px;font-weight:800}.main{padding:10px 12px 110px;max-width:1200px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent-text);text-transform:uppercase}.hero{padding:0 1px 16px;border-bottom:1px solid var(--border);margin-bottom:18px}.hero h1{margin:6px 0}.hero p{color:var(--muted);max-width:650px}.panel{border:1px solid var(--border);border-radius:20px;background:var(--panel);padding:14px 12px;margin:0 0 14px}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.panel-head p{margin-top:8px}.stack{display:grid;gap:12px}.section-gap{margin-top:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>div{min-width:0}.row-title{font-weight:700}.row-meta{font-size:13px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:4px 10px;border:1px solid var(--choice-border);border-radius:999px;background:var(--choice);color:var(--accent-text);font-size:12px;font-weight:700;white-space:nowrap}.profile-row{border-bottom:1px solid var(--border);padding:14px 0}.profile-row:last-child{border-bottom:0}.profile-choice{display:flex;gap:11px;align-items:flex-start;flex:1;min-width:0}.profile-choice input{margin-top:3px}.profile-action{font-size:13px;white-space:nowrap}.full{width:100%}.hint{font-size:13px;color:var(--muted);line-height:1.45}.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.equipment-choice{display:flex;align-items:center;gap:9px;min-width:0;min-height:48px;padding:9px 11px;border:1px solid var(--border);border-radius:13px;background:var(--panel);font-size:14px;overflow-wrap:anywhere}.equipment-choice.checked{background:var(--choice);border-color:var(--choice-border)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1 1 140px}.context{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:var(--soft);border-radius:14px;padding:10px 12px}.context .button{flex:none}.segments{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--border);border-radius:15px;background:var(--soft)}.segments a{min-width:0;min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:11px;text-decoration:none;font-size:14px;font-weight:700;text-align:center}.segments a[aria-current=true]{background:var(--choice);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--choice-border),inset 0 1px 0 rgba(255,255,255,.26)}.notice{border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);background:var(--soft)}.results-count{font-size:12px;color:var(--muted)}.exercise{display:flex;gap:10px;align-items:center;padding:13px 0;border-top:1px solid var(--border)}.thumb{width:48px;height:48px;flex:none;border-radius:11px;border:1px solid var(--border);background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center}.exercise strong{font-size:14px}.exercise small{display:block;margin-top:3px}.exercise .end{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted)}.filters{display:grid;gap:8px}.select-mock{height:44px;display:flex;align-items:center;border:1px solid var(--border);border-radius:13px;background:var(--soft);padding:0 12px}.empty{text-align:center;padding:27px 8px}.empty h3{margin-bottom:8px}.empty p{max-width:420px;margin:auto;color:var(--muted)}.empty .button{margin-top:14px}.dock{position:fixed;z-index:4;bottom:max(8px,env(safe-area-inset-bottom));left:10px;right:10px;height:70px;border:1px solid #69736e;border-radius:24px;background:var(--dock);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 4px 12px #0003}.dock span{text-align:center;font-size:11px;font-weight:700;line-height:1.15}.dock svg{display:block;width:21px;height:21px;margin:0 auto 4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dialog-backdrop{position:fixed;z-index:5;inset:0;background:#000a;display:flex;justify-content:center;align-items:flex-end}.dialog{width:100%;max-height:94dvh;overflow:auto;border:1px solid var(--border);border-radius:22px 22px 0 0;background:var(--panel);box-shadow:0 20px 70px #0006;padding:18px 16px max(18px,env(safe-area-inset-bottom))}.dialog .panel-head{margin-bottom:14px}.dialog .exercise:last-child{border-bottom:1px solid var(--border)}.dialog input[type=search]{margin-bottom:12px}.builder{display:grid;gap:10px}.builder-cols{display:grid;grid-template-columns:1fr}.builder-day{border:1px solid var(--border);border-radius:14px;padding:14px;min-height:150px}.builder-side{display:none}.builder-row{margin-top:12px;padding:13px;border:1px solid var(--choice-border);border-radius:12px;background:var(--choice)}.picker-inline{display:none}.offline{border:1px solid #b59c65;border-radius:12px;padding:12px;background:var(--soft);font-size:13px}.prototype-label{position:fixed;z-index:10;right:4px;top:2px;background:#111;color:#ddd;font:10px Arial;padding:2px 5px;border-radius:5px;opacity:.75}
@media(min-width:760px){.mobile-header,.dock,.picker-mobile{display:none}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{display:flex;position:sticky;top:0;height:100vh;flex-direction:column;border-right:1px solid var(--border);padding:30px 26px;gap:22px;background:var(--soft)}.sidebar .lockup{align-self:center;margin-bottom:15px}.sidebar .logo{width:42px}.sidebar a{text-decoration:none;font-size:14px;font-weight:700;padding:12px;border-radius:12px}.sidebar a.current{background:var(--choice);box-shadow:inset 0 0 0 1px var(--choice-border);color:var(--accent-text)}.main{padding:36px 30px 60px;width:100%}.hero{padding-bottom:22px;margin-bottom:28px}.hero h1{font-size:48px}.panel{padding:20px}.profile-layout{max-width:850px}.filters{grid-template-columns:repeat(3,1fr)}.choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dialog-backdrop{align-items:center;padding:24px}.dialog{max-width:760px;border-radius:24px;padding:26px 34px;max-height:92dvh}.builder-cols{grid-template-columns:160px minmax(0,1fr) 300px;gap:0}.builder-side{display:block;border:1px solid var(--border);padding:14px;min-width:0}.builder-day{border-radius:0}.picker-inline{display:block}.picker-inline .context{padding:8px}.picker-inline .segments a{font-size:12px}.picker-inline .thumb{width:36px;height:36px}.picker-inline .exercise{gap:7px}.picker-inline .exercise .end{white-space:normal}.picker-inline .exercise strong{font-size:12px}}
button.text,.button.text,.segments a,.profile-choice{min-height:44px}.equipment-choice.wide{grid-column:1/-1}
</style></head>
<body><span class="prototype-label">МАКЕТ · тестовые данные</span><div class="shell"><aside class="sidebar"><div class="lockup"><img class="logo brand" alt=""><b>YOUR FITNESS<br>COACH</b></div><span class="muted">Анна Петрова · Клиент</span><a href="#">Сегодня</a><a href="#">План</a><a href="#">Питание</a><a href="#">Прогресс</a><small>РЕСУРСЫ</small><a class="current" href="#">Упражнения</a><a href="#">Профиль и настройки</a></aside><div><header class="mobile-header"><div class="lockup"><img class="logo brand" alt=""><b>YOUR FITNESS<br>COACH</b></div><span class="avatar">АП</span></header><main class="main" id="app"></main></div></div>
<nav class="dock" aria-label="Основная навигация"><span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Сегодня</span><span><svg viewBox="0 0 24 24"><path d="M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10"/></svg>План</span><span><svg viewBox="0 0 24 24"><path d="M5 3v7a3 3 0 0 0 6 0V3M8 3v18M17 3v18M17 3c3 2 3 8 0 9"/></svg>Питание</span><span><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16v4M10 12v8M15 9v11M20 4v16M4 12l5-4 4 2 6-6"/></svg>Прогресс</span><span><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>Добавить</span></nav>
<script>
const params=new URLSearchParams(location.search),state=params.get('state')||'profiles',theme=params.get('theme')==='light'?'light':'dark';document.documentElement.dataset.theme=theme;document.querySelectorAll('.brand').forEach(img=>img.src=`../../../frontend/public/assets/brand/yfc-mark-${theme}.svg`);
const url=(s)=>`?theme=${theme}&state=${s}`;
const link=(s,text,cls='button')=>`<a class="${cls}" href="${url(s)}">${text}</a>`;
const hero=(title,copy,crumb='ПРОФИЛЬ / ОБОРУДОВАНИЕ')=>`<header class="hero"><div class="eyebrow">${crumb}</div><h1>${title}</h1><p>${copy}</p></header>`;
const segments=(active,context='catalog')=>`<div class="segments" aria-label="Доступность упражнений"><a href="${url(context==='picker'?'picker':'catalog-available')}" aria-current="${active==='available'}">Доступное</a><a href="${url(context==='picker'?'picker-all':'catalog-all')}" aria-current="${active==='all'}">Все упражнения</a></div>`;
const profileContext=(name='Дом',destination='profiles')=>`<div class="context"><div><small>Профиль оборудования</small><div class="row-title">${name} <span class="pill">Активен</span></div></div>${link(destination,'Изменить','button text')}</div>`;
const exercise=(title,details,badge='')=>`<div class="exercise"><div class="thumb">Нет<br>фото</div><div><strong>${title}</strong><small>${details}</small></div>${badge?`<span class="end">${badge}</span>`:''}</div>`;
const profileRow=(name,details,active=false,editable=true)=>`<div class="profile-row row"><label class="profile-choice"><input type="radio" name="profile" ${active?'checked':''}><span><span class="row-title">${name}</span> ${active?'<span class="pill">Активен</span>':''}<span class="row-meta" style="display:block">${details}</span></span></label>${editable&&name!=='Без профиля'?link('editor-filled','Изменить','button text profile-action'):''}</div>`;
const equipment=['Гантели','Штанга','Скамья','Стойка / рама','Тросовый блок','Тренажёры','Гиря','Турник','Брусья','Кардиооборудование','Другое'];
const equipmentGrid=(filled,baseOnly=false)=>`<div class="choice-grid">${equipment.filter(name=>!baseOnly||!['Стойка / рама','Турник','Брусья'].includes(name)).map(name=>{const checked=filled&&['Гантели','Скамья','Турник'].includes(name);return `<label class="equipment-choice ${checked?'checked':''} ${name==='Кардиооборудование'?'wide':''}"><input type="checkbox" ${checked?'checked':''}><span>${name}</span></label>`}).join('')}</div>`;
const app=document.querySelector('#app');
function profiles(empty=false){return `${hero('Профили оборудования','Выберите набор для поиска упражнений. Программы, веса и история не изменятся.')}<section class="panel profile-layout"><div class="panel-head"><div><h2>Мои профили</h2><p class="hint">Активный профиль используется только для вас.</p></div></div><div class="section-gap">${profileRow('Без профиля','Показывать все упражнения')}${profileRow('Дом','Гантели · скамья · турник',!empty)}${profileRow('Тренажёрный зал','Штанга · стойка · тренажёры и ещё 4')}${profileRow('Поездка','Дополнительное оборудование не выбрано',empty)}</div><div class="section-gap">${link('editor-empty','Создать профиль','button primary full')}</div></section>`}
function editor(filled,notice=''){const messages={offline:'<strong>Нет подключения</strong><br>Изменения пока не сохранены на сервере. Повторите сохранение после восстановления связи.',conflict:'<strong>Профиль изменён на другом устройстве</strong><br>Ваши изменения не сохранены. Загрузите актуальный профиль и проверьте его перед повторным сохранением.',error:'<strong>Не удалось сохранить профиль</strong><br>Проверьте подключение и повторите. Ваши изменения остаются на экране.'};return `${hero(filled?'Изменить профиль':'Новый профиль','Укажите оборудование, которое действительно доступно в этом месте.')}<section class="panel profile-layout stack">${notice?`<div class="offline" role="status">${messages[notice]}</div>`:''}<label><span class="field-label">Название профиля</span><input type="text" value="${filled?'Дом':''}" placeholder="Например, Дом или Поездка"></label><div><h3>Что доступно?</h3><p class="hint">Собственный вес доступен всегда. Отметьте также скамью, турник и другие необходимые принадлежности.</p></div>${equipmentGrid(filled)}<div class="actions">${link('profiles','Сохранить','button primary')}${link('profiles','Отмена')}</div>${filled?link('delete-confirm','Удалить профиль','button text'):''}</section>`}
function catalog(mode){const noProfile=mode==='no-profile',all=mode==='all',empty=mode==='empty',emptyProfile=mode==='empty-profile';return `${hero('Упражнения','Найдите движение по названию, мышцам или оборудованию.','YOUR FITNESS COACH')}<section class="panel stack"><div><h2>Каталог упражнений</h2><p class="hint">Выберите подходящее движение и откройте его технику.</p></div><label><span class="field-label">Поиск</span><input type="search" placeholder="Например, приседания или гантели" value="${empty?'жим ногами':''}"></label><div class="filters"><div><span class="field-label">Мышцы</span><div class="select-mock">Все группы</div></div><div><span class="field-label">Оборудование</span><div class="select-mock">Любое</div></div><div><span class="field-label">Опыт</span><div class="select-mock">Любой</div></div></div>${noProfile?`<div class="context"><div><strong>Профили оборудования</strong><div class="row-meta">Пока показываются все упражнения</div></div>${link('profiles','Настроить','button text')}</div>`:`${profileContext(emptyProfile?'Поездка':'Дом')}${segments(all?'all':'available')}`}<div class="row"><span class="results-count">Найдено: <strong>${empty?'0':all?'5':emptyProfile?'2':'3'}</strong></span>${!noProfile&&!all&&!empty?`<span class="results-count">Скрыто: ${emptyProfile?'3':'2'}</span>`:''}</div>${empty?`<div class="empty"><h3>Нет подходящих упражнений</h3><p>Для этого поиска и профиля ничего не найдено. Можно показать все упражнения или изменить профиль.</p>${link('catalog-all','Показать все упражнения')}</div>`:`<div>${emptyProfile?exercise('Приседания без веса','Ноги · собственный вес'):`${exercise('Приседания с гантелями','Ноги · гантели')}${exercise('Жим гантелей лёжа','Грудь · гантели и скамья')}`}${all?exercise('Жим ногами','Ноги · тренажёр'):''}${exercise('Моё упражнение','Своё · оборудование нужно проверить','Проверить')}${all?exercise('Тяга верхнего блока','Спина · тросовый блок'):''}</div>`}${!noProfile&&!empty?'<div class="notice">Свои упражнения и упражнения с неизвестным оборудованием остаются в списке с пометкой «Проверить».</div>':''}</section>`}
function pickerContents(all=false){return `<input type="search" placeholder="Начните вводить название">${profileContext('Дом','picker-profile')}<div class="section-gap">${segments(all?'all':'available','picker')}</div><div class="section-gap row"><small>Найдено: ${all?'5':'3'}</small>${all?'':'<small>Скрыто: 2</small>'}</div>${exercise('Приседания с гантелями','Ноги · гантели')}${exercise('Жим гантелей лёжа','Грудь · гантели и скамья')}${all?exercise('Жим ногами','Ноги · тренажёр'):''}${exercise('Моё упражнение','Своё · оборудование нужно проверить','Проверить')}${all?exercise('Тяга верхнего блока','Спина · тросовый блок'):''}<p class="hint section-gap">Упражнения с неизвестным оборудованием остаются видимыми.</p>`}
function builder(all=false){return `${hero('Создать или импортировать','Текущая программа, настройки и быстрые действия.','ПЛАН / МОЯ ПРОГРАММА')}<section class="panel"><h2>Создать свою программу</h2><div class="section-gap eyebrow">ШАГ 2</div><h3>Тренировочные дни</h3><div class="builder-cols section-gap"><aside class="builder-side"><strong>Дни программы</strong><div class="builder-row">День 1<br><small>Тренировка 1</small></div></aside><div class="builder-day"><span class="field-label">Название дня</span><div class="select-mock">Тренировка 1</div><div class="section-gap row"><h3>Упражнения</h3><small>0 упр.</small></div><div class="builder-row">1 &nbsp; Выберите упражнение</div><div class="section-gap">Добавить упражнение</div></div><aside class="builder-side"><div class="eyebrow">ДЕНЬ 1 · УПРАЖНЕНИЕ 1</div><h3 class="section-gap">Выберите упражнение</h3><p class="hint section-gap">Поиск упражнения</p><div class="picker-inline section-gap">${pickerContents(all)}</div></aside></div></section>`}
function picker(all=false){return `${builder(all)}<div class="dialog-backdrop picker-mobile"><section class="dialog picker-dialog" role="dialog" aria-label="Выбор упражнения"><div class="panel-head"><h2>Выбор упражнения</h2>${link('profiles','Закрыть')}</div>${pickerContents(all)}</section></div>`}
function replacement(){return `${hero('Сегодня','Тренировка по вашей программе.','YOUR FITNESS COACH')}<section class="panel"><h2>Тренировка 1</h2><p class="hint section-gap">Жим штанги лёжа</p></section><div class="dialog-backdrop"><section class="dialog" role="dialog" aria-label="Заменить только в этой тренировке"><div class="panel-head"><div><div class="eyebrow">ТОЛЬКО ЭТА ТРЕНИРОВКА</div><h2>Заменить только в этой тренировке</h2><p class="hint">Сначала покажем точные изменения. Программа и будущие тренировки не изменятся.</p></div>${link('profiles','Закрыть')}</div><div class="stack">${profileContext('Дом','replacement-profile')}<div><h3>Что доступно сейчас?</h3><p class="hint">Основное оборудование можно изменить для этой замены.</p></div>${equipmentGrid(true,true)}<div class="notice">Принадлежности из профиля «Дом»: турник. Чтобы изменить их, выберите или измените профиль.</div><div><h3>Проверенные варианты</h3><p class="hint">Подходящие варианты проверяются сервером по выбранному оборудованию.</p></div>${exercise('Жим гантелей лёжа','Гантели · скамья')}<div class="actions">${link('replacement','Показать изменения','button primary')}${link('catalog-all','Отмена')}</div></div></section></div>`}
function chooseProfile(from){return `${from==='picker'?builder():hero('Сегодня','Тренировка по вашей программе.','YOUR FITNESS COACH')}<div class="dialog-backdrop"><section class="dialog picker-dialog" role="dialog" aria-label="Выбрать профиль"><h2>Выбрать профиль</h2><p class="hint section-gap">Профиль меняет список вариантов. ${from==='picker'?'Черновик программы останется открытым.':'Тренировка останется без изменений.'}</p><div class="section-gap">${profileRow('Без профиля',from==='picker'?'Показать все упражнения':'Выбрать оборудование вручную',false,false)}${profileRow('Дом','Гантели · скамья · турник',true,false)}${profileRow('Тренажёрный зал','Штанга · стойка · тренажёры',false,false)}${profileRow('Поездка','Дополнительное оборудование не выбрано',false,false)}</div><div class="actions section-gap">${link(from,'Выбрать','button primary')}${link(from,'Отмена')}</div><p class="hint section-gap">Профили можно изменить в настройках.</p></section></div>`}
function deleteConfirm(){return `${profiles()}<div class="dialog-backdrop"><section class="dialog picker-dialog" role="dialog" aria-label="Удалить профиль"><div class="stack"><h2>Удалить профиль «Дом»?</h2><p class="hint">Программы, веса и история не изменятся. Пока не выбран другой профиль, будут показаны все упражнения.</p><div class="actions">${link('profiles','Удалить профиль')}${link('profiles','Отмена','button primary')}</div></div></section></div>`}
if(state==='profiles')app.innerHTML=profiles();else if(state==='profile-empty')app.innerHTML=profiles(true);else if(state==='editor-empty')app.innerHTML=editor(false);else if(state==='editor-filled')app.innerHTML=editor(true);else if(['offline','conflict','error'].includes(state))app.innerHTML=editor(true,state);else if(state==='delete-confirm')app.innerHTML=deleteConfirm();else if(state==='catalog-none')app.innerHTML=catalog('no-profile');else if(state==='catalog-empty')app.innerHTML=catalog('empty');else if(state==='catalog-empty-profile')app.innerHTML=catalog('empty-profile');else if(state==='catalog-all')app.innerHTML=catalog('all');else if(state==='picker')app.innerHTML=picker();else if(state==='picker-all')app.innerHTML=picker(true);else if(state==='picker-profile')app.innerHTML=chooseProfile('picker');else if(state==='replacement')app.innerHTML=replacement();else if(state==='replacement-profile')app.innerHTML=chooseProfile('replacement');else app.innerHTML=catalog('available');
document.querySelectorAll('.equipment-choice input').forEach(input=>input.addEventListener('change',()=>input.closest('.equipment-choice').classList.toggle('checked',input.checked)));
if(state.startsWith('picker')){document.querySelector('.sidebar a.current')?.classList.remove('current');[...document.querySelectorAll('.sidebar a')].find(a=>a.textContent==='План')?.classList.add('current')}
</script></body></html>
