:root{color-scheme:dark;--canvas:#090b0b;--surface:#141717;--secondary:#1b1f1f;--text:#f5f5f5;--muted:#b8b8b8;--border:#404040;--accent:#b2f520;--accent-text:#b9ea72;--on:#090b0b;--warning:#e5b963;--warning-bg:#2b2314;--danger:#ef7474;--danger-bg:#2c1717}
:root[data-theme=light]{color-scheme:light;--canvas:#ffffff;--surface:#fff;--secondary:#f0f0f0;--text:#151515;--muted:#606060;--border:#d0d0d0;--accent:#b2f520;--accent-text:#486414;--on:#090b0b;--warning:#98600f;--warning-bg:#f5ead5;--danger:#b93838;--danger-bg:#f9e7e7}
:root{--focus:#b2f520;--choice-surface:linear-gradient(180deg,#3b4436,#2a3028);--choice-outline:#778e55;--choice-ink:#d9f9b5;--choice-relief:inset 0 0 0 1px var(--choice-outline),inset 0 1px 0 rgb(255 255 255 / 30%),inset 0 -1px 0 rgb(0 0 0 / 28%),0 2px 5px rgb(0 0 0 / 18%)}
:root[data-theme=light]{--focus:#111;--choice-surface:linear-gradient(180deg,#f7ffe8,#dbeeb7);--choice-outline:#758b50;--choice-ink:#334612;--choice-relief:inset 0 0 0 1px var(--choice-outline),inset 0 1px 0 rgb(255 255 255 / 90%),inset 0 -1px 0 rgb(52 72 20 / 12%),0 2px 5px rgb(25 40 15 / 10%)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}button,input,select{font:inherit}button,input,select{min-height:44px}button,select,input{border-radius:14px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button:disabled{opacity:.55;cursor:default}
.reviewbar{padding:8px 12px;background:#202525;color:#f5f5f5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}.reviewbar select{color-scheme:light;min-height:34px;background:#fff;color:#151515;border:0;padding:0 8px}.reviewbar strong{margin-right:auto}.reviewbar label{display:flex;align-items:center;gap:6px}
main{max-width:784px;margin:12px auto 28px;padding:0 12px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Oswald,'Arial Narrow',sans-serif;line-height:1.2}h1{font-size:23px}h2{font-size:18px}h3{font-size:16px}.head{display:flex;align-items:center;gap:12px;margin:12px 0 20px}.head h1{font-family:Inter,sans-serif;font-size:17px;line-height:1.35}.back{color:var(--text);background:transparent;border:0;padding:0 2px;min-width:50px;text-align:left}.small{color:var(--muted);font-size:13px}.hint{color:var(--muted);font-size:14px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin:0 0 16px}.panel>h2+.hint,.panel>h3+.hint{margin-top:7px}.stack>*+*{margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row>*{min-width:0}.field{display:grid;gap:6px;min-width:0}.field label,.caption{font-size:12px;font-weight:700}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.fields .field{min-width:0}input:not([type=checkbox]):not([type=radio]),select{width:100%;padding:8px 12px;background:var(--surface);color:var(--text);border:1px solid var(--border)}.choice{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 10px;border-radius:14px}.choice:has(input:checked){background:var(--choice-surface);box-shadow:var(--choice-relief);color:var(--choice-ink)}.choice input{accent-color:var(--accent);width:20px;height:20px;min-height:20px;margin:2px 0 0;flex:none}.choice span{display:grid;gap:3px}.choice strong{font-size:15px}.choice small{font-size:13px;color:var(--muted)}.divider{border:0;border-top:1px solid var(--border);margin:16px 0}
.weeks{margin-top:12px;border-top:1px solid var(--border)}.weekrow{display:grid;grid-template-columns:minmax(80px,1fr) minmax(132px,1fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}.weekrow label{font-weight:600}.weekrow select{font-size:14px}.labelblock{display:grid;gap:3px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--accent-text);background:var(--secondary);width:max-content}.primary,.secondary{border:1px solid var(--border);padding:10px 14px;font-weight:700}.primary{width:100%;background:var(--accent);color:var(--on);border-color:var(--accent)}.secondary{background:var(--surface);color:var(--text)}.textbutton{border:0;padding:8px 0;min-height:44px;background:transparent;color:var(--text);font-weight:700}.listrow{padding:12px 0;border-top:1px solid var(--border)}.listrow:first-of-type{border-top:0}.listrow h3{font:700 15px/1.4 Inter,sans-serif}.listrow p{font-size:13px;color:var(--muted);margin-top:4px}.callout{border:1px solid var(--border);background:var(--secondary);border-radius:14px;padding:12px;font-size:14px}.warning{background:var(--warning-bg);border-color:var(--warning)}.warning strong{color:var(--warning)}.error{background:var(--danger-bg);border-color:var(--danger)}.error strong{color:var(--danger)}.foot{margin:18px 0;color:var(--muted);font-size:13px}.editor{border:1px solid var(--border);border-radius:20px;padding:12px;background:var(--surface)}.step{font-size:12px;color:var(--accent-text);font-weight:700;margin-top:12px}.day{border:1px solid var(--accent-text);border-radius:18px;background:var(--secondary);padding:22px;text-align:center}.day b{display:block;font-size:20px;margin:8px 0}.simpleline{border:1px solid var(--border);border-radius:14px;padding:12px}.simpleline h3{font:700 15px Inter}.simpleline p{font-size:13px;color:var(--muted);margin-top:4px}.loader{height:14px;border-radius:6px;background:var(--secondary);margin:12px 0}.loader.short{width:55%}
@media(max-width:400px){main{padding:0 10px}.panel{padding:14px}.fields{gap:8px}.weekrow{grid-template-columns:minmax(76px,1fr) minmax(128px,1fr);gap:8px}.head{margin-bottom:16px}}
@media(max-width:400px){.weekrow{grid-template-columns:1fr;gap:6px}}

<body><div class="reviewbar"><strong>МАКЕТ · Issue #920 · синтетические данные</strong><label>Состояние <select id="views"></select></label><label>Тема <select id="themes"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label></div><main id="app"></main>
<script>
const options={
 replacement:'Замена упражнения',prescription:'Предписание подходов',scope920:'Область будущих изменений',
 structure:'Состав тренировки',days920:'Тренировочные дни',cycle920:'Переход на новый цикл',cyclepreview920:'Проверка нового цикла',daypreview920:'Проверка состава дней',coachactive920:'Тренер и начатая тренировка',active920:'Незавершённый подход',
 activepreview920:'Проверка подхода',offline920:'Нет связи',impact920:'Проверка изменений',conflict920:'План изменился'
};
const q=new URLSearchParams(location.search);const view=options[q.get('view')]?q.get('view'):'setup';const theme=q.get('theme')==='light'?'light':'dark';document.documentElement.dataset.theme=theme;
const views=document.getElementById('views');for(const [key,value] of Object.entries(options)){const o=document.createElement('option');o.value=key;o.textContent=value;views.append(o)}views.value=view;document.getElementById('themes').value=theme;
function change(){location.search='?view='+views.value+'&theme='+document.getElementById('themes').value}views.addEventListener('change',change);document.getElementById('themes').addEventListener('change',change);
const header=(name)=>'<div class="head"><button class="back" type="button">Назад</button><h1>'+name+'</h1></div>';
const panel=(content)=>'<section class="panel">'+content+'</section>';
const button=(text,kind='primary')=>'<button type="button" class="'+kind+'">'+text+'</button>';
const hint=(text)=>'<p class="hint">'+text+'</p>';
const choice=(title,description,checked,type='checkbox',name='choice')=>'<label class="choice" data-yfc-choice><input type="'+type+'" name="'+name+'" '+(checked?'checked':'')+'><span><strong>'+title+'</strong><small>'+description+'</small></span></label>';
const field=(label,value)=>'<div class="field"><label>'+label+'<input type="number" value="'+value+'" min="1" inputmode="numeric"></label></div>';
const weekRows=(values)=>'<div class="weeks">'+values.map((v,i)=>'<div class="weekrow"><label for="w'+i+'">Неделя '+(i+1)+'</label><select id="w'+i+'"><option'+(v==='Не задан'?' selected':'')+'>Не задан</option><option'+(v==='Лёгкая'?' selected':'')+'>Лёгкая</option><option'+(v==='Средняя'?' selected':'')+'>Средняя</option><option'+(v==='Тяжёлая'?' selected':'')+'>Тяжёлая</option></select></div>').join('')+'</div>';
const weekList=(items)=>items.map(item=>'<div class="listrow"><h3>Неделя '+item[0]+' <span class="small">· Исходная '+item[1]+' · Проход '+item[2]+'</span></h3><p>'+item[3]+' · Пн: Тренировка 1 · Ср: Тренировка 2</p></div>').join('');
const cycle=(k,n,repeat,types)=>panel('<div class="stack"><div><h2>Периодизация</h2>'+hint('Настройте исходные недели и при необходимости повторите их.')+'</div>'+choice('Включить периодизацию','Можно оставить тип недели незаданным.',true)+'<div class="fields">'+field('Исходных недель',k)+field('Всего недель',n)+'</div>'+choice('Повторять исходный цикл','Порядок исходных недель повторяется до конца программы.',repeat)+'<div><h3>Типы исходных недель</h3><p class="small">Тип не меняет нагрузку автоматически.</p>'+weekRows(types)+'</div>'+button('Посмотреть план на '+n+' недель','secondary')+'</div>');
const weekLabel=(k)=>{const last=k%10, lastTwo=k%100;return lastTwo>=11&&lastTwo<=14?'исходных недель':last===1?'исходная неделя':last>=2&&last<=4?'исходные недели':'исходных недель'};
const preview=(k,n,items)=>panel('<div class="row"><div><h2>План на '+n+' недель</h2><p class="small">'+k+' '+weekLabel(k)+' · повтор включён</p></div></div><div class="weeks">'+weekList(items)+'</div><p class="small" style="margin-top:12px">Показаны отдельные недели. Все недели доступны в полном списке.</p><button class="textbutton" type="button">Показать все '+n+' недель</button>');

let content='';
if(view==='replacement')content=header('Изменить будущий план')+panel('<div class="stack"><div><h2>Замена упражнения</h2>'+hint('Тренировка 1 · исходная неделя 2')+'</div><div class="field"><label>Сейчас<select><option>Жим штанги лёжа</option></select></label></div><div class="field"><label>Заменить на<select><option>Жим гантелей лёжа</option><option>Выбрать другое упражнение</option></select></label></div><p class="small">Доступны совместимые упражнения из вашего каталога.</p><div class="fields">'+field('Подходы',4)+'<div class="field"><label>Повторы<input value="6–8"></label></div></div>'+field('Отдых, сек',90)+button('Выбрать недели')+'</div>');
if(view==='prescription')content=header('Предписание упражнения')+panel('<div class="stack"><div><h2>Жим гантелей лёжа</h2>'+hint('Настройте план каждого подхода. Записанные результаты не изменятся.')+'</div><div class="simpleline"><h3>Разминочный подход</h3><p>Без заданного веса · 10 повторов</p><button type="button" class="textbutton">Изменить</button></div><div class="simpleline"><h3>Рабочие подходы · 2</h3><div class="fields"><div class="field"><label>Вес, кг<input value="40"></label></div><div class="field"><label>Повторы<input value="6–8"></label></div></div><div class="fields"><div class="field"><label>Усилие<select><option>RIR</option></select></label></div>'+field('Повторов в запасе',2)+'</div>'+field('Отдых, сек',90)+'</div><button type="button" class="textbutton">Добавить подход</button>'+button('Выбрать недели')+'</div>');
if(view==='scope920')content=header('Область изменения')+panel('<div class="stack"><h2>К каким неделям применить?</h2>'+hint('Выбрана неделя 8 · исходная неделя 2 · проход 3')+choice('Только неделя 8','Изменится одно вхождение.',false,'radio','scope920')+choice('Будущие повторы исходной недели 2','Недели 8, 11 и 14.',false,'radio','scope920')+choice('Все будущие недели','Начиная с недели 8.',true,'radio','scope920')+choice('Выбрать недели','Отметьте конкретные вхождения.',false,'radio','scope920')+'<div class="callout warning"><strong>История сохранится</strong><p>Выполненные и начатые тренировки останутся без изменений.</p></div>'+button('Проверить изменения')+'</div>');
if(view==='structure')content=header('Состав тренировки')+panel('<div class="stack"><div><h2>Тренировка 1</h2>'+hint('Будущий план · неделя 8')+'</div><div class="simpleline"><h3>1 · Жим штанги лёжа</h3><p>4 подхода · 6–8 повторов</p><button type="button" class="textbutton">Изменить или заменить</button></div><div class="simpleline"><h3>2 · Тяга гантели</h3><p>3 подхода · 8–10 повторов</p><button type="button" class="textbutton">Переместить выше</button><br><button type="button" class="textbutton">Убрать из будущего плана</button></div><button type="button" class="secondary">Добавить упражнение</button>'+button('Выбрать недели')+'</div>');
if(view==='days920')content=header('Тренировочные дни')+panel('<div class="stack"><div><h2>Будущий план</h2>'+hint('Состав и порядок дней с выбранной недели.')+'</div><div class="simpleline"><h3>День 1 · Силовая</h3><p>Понедельник · 4 упражнения</p><button type="button" class="textbutton">Изменить состав</button></div><div class="simpleline"><h3>День 2 · Верх тела</h3><p>Среда · 3 упражнения</p><button type="button" class="textbutton">Переместить выше</button><br><button type="button" class="textbutton">Убрать из будущего плана</button></div><button type="button" class="secondary">Добавить тренировочный день</button><div class="callout warning"><strong>История сохранится</strong><p>Начатые и выполненные тренировки останутся на прежних датах.</p></div>'+button('Выбрать недели')+'</div>');
if(view==='cycle920')content=header('Изменить будущий цикл')+panel('<div class="stack"><div><h2>Новый порядок недель</h2>'+hint('История до выбранной границы сохранит прежний цикл.')+'</div><div class="fields">'+field('Начиная с недели',7)+field('Исходных недель',4)+'</div><div class="weeks"><div class="weekrow"><label for="cycle-1">Новая неделя 1</label><select id="cycle-1"><option>Исходная 1</option></select></div><div class="weekrow"><label for="cycle-2">Новая неделя 2</label><select id="cycle-2"><option>Исходная 2</option></select></div><div class="weekrow"><label for="cycle-3">Новая неделя 3</label><select id="cycle-3"><option>Исходная 3</option></select></div><div class="weekrow"><label for="cycle-4">Новая неделя 4</label><select id="cycle-4"><option>Копия исходной 1</option></select></div></div>'+choice('Повторять новый цикл','Только для будущих тренировок.',true)+'<div class="callout warning"><strong>Проверьте границу</strong><p>До недели 7 порядок и результаты сохранятся.</p></div>'+button('Проверить изменения')+'</div>');
if(view==='cyclepreview920')content=header('Проверить новый цикл')+panel('<div class="stack"><h2>Переход с недели 7</h2><p class="hint">Было 3 исходные недели · станет 4</p><div class="callout warning"><strong>История сохранится</strong><p>Недели до границы и записанные результаты не меняются.</p></div><div class="weeks"><div class="listrow"><h3>Неделя 7 · 7 декабря</h3><p>Исходная 1 → новая 1 · Тренировка 1</p></div><div class="listrow"><h3>Неделя 10 · 28 декабря</h3><p>Исходная 1 → новая 4 · Тренировка 1</p></div><div class="listrow"><h3>Неделя 11 · 4 января</h3><p>Исходная 2 → новая 1 · Тренировка 1</p></div></div><p class="small">Показаны примеры. Все затронутые недели доступны в списке.</p>'+button('Применить изменения')+button('Вернуться','secondary')+'</div>');
if(view==='daypreview920')content=header('Проверить состав')+panel('<div class="stack"><h2>Будущие тренировки</h2><p class="hint">Убрать день 2 · начиная с недели 8</p><div class="callout warning"><strong>Начатые тренировки сохранятся</strong><p>Будущие запланированные тренировки этого дня будут отменены вместе с их напоминаниями.</p></div><div class="weeks"><div class="listrow"><h3>Неделя 8 · 16 декабря</h3><p>Верх тела · начата · не изменится</p></div><div class="listrow"><h3>Неделя 9 · 23 декабря</h3><p>Верх тела · запланирована · будет отменена</p></div><div class="listrow"><h3>Неделя 10 · 30 декабря</h3><p>Верх тела · запланирована · будет отменена</p></div></div>'+button('Применить изменения')+button('Вернуться','secondary')+'</div>');
if(view==='coachactive920')content=header('Программа клиента')+panel('<div class="stack"><h2>Тренировка уже началась</h2><div class="callout warning"><strong>Текущий подход не изменится</strong><p>Изменить незавершённый подход может спортсмен после проверки и подтверждения в тренировке.</p></div><p class="hint">Вы можете применить изменения к будущим тренировкам.</p>'+button('Проверить будущий план')+button('Вернуться','secondary')+'</div>');
if(view==='active920')content=header('Начатая тренировка')+panel('<div class="stack"><div><h2>Приседания</h2>'+hint('Изменение только незавершённого подхода')+'</div><div class="simpleline"><h3>Подход 1 · выполнен</h3><p>40 кг · 8 повторов · RIR 2</p></div><div class="simpleline"><h3>Подход 2 · ещё не выполнен</h3><div class="fields"><div class="field"><label>Плановый вес, кг<input value="37,5"></label></div><div class="field"><label>План повторов<input value="8"></label></div></div></div><div class="callout warning"><strong>Ваше подтверждение</strong><p>Изменится только план незавершённого подхода. Записанный результат останется прежним.</p></div>'+button('Проверить изменение')+button('Оставить как есть','secondary')+'</div>');
