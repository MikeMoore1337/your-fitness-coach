  <style>
    @font-face{font-family:Inter;src:url('assets/inter-cyrillic.woff2')}@font-face{font-family:Oswald;src:url('assets/oswald-cyrillic.woff2')}
    :root{font-family:Inter,Arial,sans-serif;color-scheme:dark;--bg:#080a09;--surface:#141716;--surface2:#1c211d;--text:#f7f8f7;--muted:#b0b4b1;--line:#424743;--lime:#b4f514;--lime-ink:#172308;--choice:#35432b;--warning:#f9d88b;--dock:rgba(27,31,29,.96);--shadow:0 18px 60px #0008}
    [data-theme=light]{color-scheme:light;--bg:#fff;--surface:#fff;--surface2:#f2f4f1;--text:#151715;--muted:#5e625e;--line:#d0d4cf;--choice:#e5f4cc;--warning:#6d4d00;--dock:rgba(250,251,250,.97);--shadow:0 18px 60px #0003}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.toolbar{position:relative;z-index:5;background:#303934;color:white;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px}.toolbar label{display:flex;align-items:center;gap:8px}.toolbar select,.toolbar button{background:#fff;color:#151715;border:0;border-radius:8px;padding:7px 9px;min-height:38px}.toolbar strong{font-size:12px;letter-spacing:.04em}.capture .toolbar{display:none}.shell{min-height:100dvh;padding-bottom:calc(112px + env(safe-area-inset-bottom))}.top{max-width:1192px;margin:auto;padding:16px 14px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:7px}.logo{width:38px;height:38px;object-fit:contain}.wordmark{font-size:10px;line-height:1.15;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.avatar{border:1px solid var(--lime);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;color:var(--text);font-weight:700;font-size:12px}.main{max-width:1192px;margin:auto;padding:4px 14px 24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.date{color:var(--muted);margin:0 0 12px}.heading{font:700 42px/1.05 Oswald,Impact,sans-serif;margin:0 0 8px;text-transform:uppercase}.subheading{font:600 24px/1.15 Oswald,Impact,sans-serif;margin:0 0 8px}.lede{margin:0;color:var(--muted)}.divider{height:1px;background:var(--line);margin:16px 0}.layout{display:grid;gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:18px}.card h2,.card h3{margin:0}.card h2{font:600 23px/1.2 Oswald,Impact,sans-serif}.card p{margin:8px 0 0}.muted{color:var(--muted)}.small{font-size:13px}.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:#0009;color:#fff;font-size:11px;font-weight:700}.hero{height:212px;border-radius:20px;overflow:hidden;position:relative;background:#222 url('assets/strength-row.webp') center 40%/cover}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#080a09d9,#080a0960),linear-gradient(0deg,#080a09aa,transparent 70%)}.hero-content{position:absolute;inset:18px;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end}.hero-content .badge{margin-bottom:auto}.hero h2{font:700 29px/1.15 Oswald,Impact,sans-serif;margin:0 0 5px}.hero p{margin:0}.hero .meta{display:flex;gap:8px;align-items:center;font-weight:600}.stack{display:grid;gap:10px}.actions{margin-top:12px}.btn{border:1px solid var(--line);background:transparent;color:var(--text);min-height:46px;padding:10px 16px;border-radius:14px;font-weight:700;text-align:center}.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}.btn.quiet{border-color:transparent;font-weight:600;text-decoration:underline;text-underline-offset:3px}.btn.full{width:100%}.sequence{margin-top:0}.sequence-title{font:600 18px Oswald,Impact,sans-serif;margin:0 0 10px}.sequence-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.sequence-row strong{display:block}.sequence-row span{color:var(--muted);font-size:13px}.tag{font-size:12px;font-weight:700;border:1px solid #6c8654;border-radius:999px;padding:4px 8px;color:var(--text);white-space:nowrap}.notice{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px}.notice strong{display:block}.notice p{margin:4px 0 0}.notice.warn{border-color:#8a744b}.weeks{margin-top:0}.weeks h2{font:600 16px Oswald,Impact,sans-serif;margin:0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}.day{text-align:center;padding:7px 2px;border:1px solid transparent;border-radius:14px;font-size:12px}.day strong{display:block;font-size:15px}.day.current{background:var(--choice);border-color:#718c4c}.week-note{color:var(--muted);font-size:12px;margin:8px 0}.dock{position:fixed;z-index:3;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #777f79;border-radius:24px;background:var(--dock);backdrop-filter:blur(20px) saturate(112%);padding:5px;box-shadow:0 4px 18px #0003}.dock button{border:1px solid transparent;background:transparent;color:var(--text);border-radius:999px;min-width:0;min-height:55px;padding:5px 1px;font-size:11px;display:grid;justify-items:center;align-content:center;gap:2px}.dock button.active{background:var(--choice);border-color:#78905e}.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mode-group{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:999px;margin-top:14px}.mode-group label{position:relative;text-align:center;border:1px solid transparent;border-radius:999px;padding:10px 6px;font-weight:700;cursor:pointer}.mode-group input{position:absolute;opacity:0}.mode-group label:has(input:checked){background:var(--choice);border-color:#78905e}.mode-group label:has(input:focus-visible){outline:3px solid var(--lime);outline-offset:2px}.detail-list{list-style:none;padding:0;margin:14px 0 0}.detail-list li{padding:10px 0;border-top:1px solid var(--line)}.detail-list strong{display:block}.details{margin-top:16px}.details summary{cursor:pointer;font-weight:700;padding:8px 0}.dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--text);max-width:min(440px,calc(100% - 24px));padding:22px;box-shadow:var(--shadow)}.dialog::backdrop{background:#0009}.dialog h2{font:600 23px Oswald,Impact,sans-serif;margin:0}.dialog p{color:var(--muted)}.dialog .btn+.btn{margin-top:8px}.status{margin:12px 0;color:var(--muted);font-size:13px}.screen-reader{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}.desktop-nav{display:none}.inline-link{padding:0;color:var(--text);text-decoration:underline;background:none;border:0;font-weight:700}.client-label{color:var(--muted);font-size:13px;margin:0 0 12px}
    @media(min-width:800px){.shell{padding-bottom:40px}.top{padding:18px 28px}.main{padding:24px 28px}.layout{grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);align-items:start;gap:26px}.layout>.weeks{grid-column:1}.hero{height:280px}.hero h2{font-size:38px}.heading{font-size:52px}.dock{display:none}.desktop-nav{display:flex;gap:8px;margin-left:auto;margin-right:28px}.desktop-nav button{border:0;border-radius:999px;background:transparent;color:var(--text);padding:10px 14px}.desktop-nav button.active{background:var(--choice)}.sequence{margin-top:0}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}}
  </style>
</head>
<body>
  <div class="toolbar" aria-label="Управление прототипом">
    <strong>ПРОТОТИП · ДАННЫЕ ВЫМЫШЛЕНЫ</strong>
    <label>Сценарий <select id="scenario"></select></label>
    <button type="button" id="theme">Светлая тема</button>
  </div>
  <div class="shell">
    <header class="top"><span class="brand"><img class="logo" id="logo" alt=""><span class="wordmark">Your Fitness<br>Coach</span></span><nav class="desktop-nav" aria-label="Главная навигация"><button class="active">Сегодня</button><button>План</button><button>Питание</button><button>Прогресс</button></nav><span class="avatar" aria-label="Профиль">Я</span></header>
    <main class="main" id="app"></main>
    <nav class="dock" aria-label="Главная навигация" id="dock"></nav>
  </div>
  <dialog class="dialog" id="confirm" aria-labelledby="dialog-title"><h2 id="dialog-title">Пропустить тренировку?</h2><p>«<span id="skip-current"></span>» будет пропущена. Следующая в очереди — «<span id="skip-next"></span>».</p><p>Уже записанные подходы и история не изменятся.</p><button class="btn primary full" id="confirm-skip">Пропустить тренировку</button><button class="btn full" id="cancel-skip" autofocus>Оставить в очереди</button></dialog>
  <script>
    const scenes={settings:'Режим по расписанию',rotation:'Выбор режима по очереди',preview:'Проверка переключения',ready:'Текущая и следующая',partial:'Незавершённая тренировка',cancel:'Отмена начатой тренировки',cancelled:'Восстановление тренировки',skip:'Явный пропуск',skipped:'После пропуска',gap:'Перерыв 7 дней',period:'Уточнение недели программы',coach:'Программа тренера',edit:'Программа изменилась',other:'Тренировка вне очереди',empty:'Нет тренировочных дней',error:'Ошибка загрузки',offline:'Нет сети',conflict:'Конфликт версий'};
    const params=new URLSearchParams(location.search);let scene=scenes[params.get('scene')]?params.get('scene'):'ready';let theme=params.get('theme')==='light'?'light':'dark';let skipCount=scene==='skipped'?1:0;let editPreview=false;let offlineState=true;let chosenDay='';
    const $=id=>document.getElementById(id), app=$('app'), select=$('scenario');
    Object.entries(scenes).forEach(([value,label])=>select.add(new Option(label,value)));select.value=scene;
    if(params.has('capture'))document.body.classList.add('capture');
    const icons=[`<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 2v3M16 2v3M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/>`,`<g transform="scale(0.09375)" fill="currentColor" stroke="none"><path d="M248,120h-8V88a16,16,0,0,0-16-16H208V64a16,16,0,0,0-16-16H168a16,16,0,0,0-16,16v56H104V64A16,16,0,0,0,88,48H64A16,16,0,0,0,48,64v8H32A16,16,0,0,0,16,88v32H8a8,8,0,0,0,0,16h8v32a16,16,0,0,0,16,16H48v8a16,16,0,0,0,16,16H88a16,16,0,0,0,16-16V136h48v56a16,16,0,0,0,16,16h24a16,16,0,0,0,16-16v-8h16a16,16,0,0,0,16-16V136h8a8,8,0,0,0,0-16ZM32,168V88H48v80Zm56,24H64V64H88V192Zm104,0H168V64h24V175.82c0,.06,0,.12,0,.18s0,.12,0,.18V192Zm32-24H208V88h16Z"/></g>`,`<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>`,`<path d="M12 16v5M16 14.639V21M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21M8 14.656V21"/>`,`<path d="M5 12h14M12 5v14"/>`];
    function renderDock(){const names=['Сегодня','План','Питание','Прогресс','Добавить'];$('dock').innerHTML=names.map((name,i)=>`<button type="button" ${i===(scene==='settings'||scene==='rotation'||scene==='preview'?1:0)?'class="active" aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg>${name}</button>`).join('')}
    function setTheme(){document.documentElement.dataset.theme=theme;$('logo').src=`assets/yfc-logo-${theme}.svg`;$('theme').textContent=theme==='dark'?'Светлая тема':'Тёмная тема'}
    const week=`<section class="weeks"><h2>Эта неделя</h2><p class="muted small">2–8 ноября</p><div class="week" aria-label="Календарная неделя"><div class="day">ПН<strong>2</strong></div><div class="day">ВТ<strong>3</strong></div><div class="day">СР<strong>4</strong></div><div class="day">ЧТ<strong>5</strong></div><div class="day current" aria-current="date">ПТ<strong>6</strong></div><div class="day">СБ<strong>7</strong></div><div class="day">ВС<strong>8</strong></div></div><p class="week-note">Календарь показывает даты; порядок тренировок от них не зависит.</p></section>`;
    function sequence(current,next){return `<section class="card sequence"><p class="eyebrow">По очереди</p><h2>Порядок тренировок</h2><div class="sequence-row"><div><span>Текущая</span><strong>${current}</strong></div><span class="tag">Сейчас</span></div><div class="sequence-row"><div><span>После неё</span><strong>${next}</strong></div></div><button class="inline-link" id="order-help" type="button">Как работает очередь?</button><p class="small muted" id="order-explanation" hidden>Очередь меняется после завершения или подтверждённого пропуска. Дни отдыха её не меняют.</p></section>`}
    function hero(title,status,detail,action){return `<div class="hero"><div class="hero-content"><div class="meta"><span class="badge">${status}</span><span>По очереди</span></div><h2>${title}</h2><p>${detail}</p></div></div><div class="stack actions"><button class="btn primary" id="start" type="button">${action}</button><button class="btn" id="show-exercises" type="button">Посмотреть упражнения</button>${scene==='partial'?'<button class="btn quiet" id="open-cancel" type="button">Отменить тренировку</button>':`<button class="btn quiet" id="skip" type="button" ${scene==='offline'?'disabled':''}>Пропустить тренировку</button>`}</div><p class="status" id="action-status" role="status"></p>`}
    function content(){
      if(scene==='settings'||scene==='rotation'){const rotating=scene==='rotation';return `<p class="eyebrow">План · текущая программа</p><h1 class="heading">Управление программой</h1><p class="lede">Силовая база · 3 тренировочных дня</p><div class="divider"></div><div class="layout"><section class="card"><h2>Порядок тренировок</h2><p class="muted">Выберите, как определять следующую тренировку.</p><div class="mode-group" role="radiogroup" aria-label="Режим тренировок"><label><input type="radio" name="mode" value="calendar" ${rotating?'':'checked'}>По расписанию</label><label><input type="radio" name="mode" value="rotation" ${rotating?'checked':''}>По очереди</label></div><p id="mode-description">${rotating?'Следующая тренировка определяется порядком дней, а не датой. Отдых не сдвигает очередь.':'Тренировки показываются по дням календарного расписания.'}</p><div class="notice" id="mode-preview" ${rotating?'':'hidden'}><strong>С какой тренировки начать?</strong><label class="screen-reader" for="start-day">Первая тренировка в очереди</label><select id="start-day" style="width:100%;min-height:44px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--text);background:var(--surface)"><option value="">Выберите тренировку</option>${['Грудь и трицепс','Спина и бицепс','Ноги и плечи'].map(day=>`<option ${chosenDay===day?'selected':''}>${day}</option>`).join('')}</select><p class="small muted">Влияние на напоминания о тренировках появится перед подтверждением.</p></div><p class="small muted">Выполненные тренировки и подходы сохранятся. План будущих тренировок будет показан перед подтверждением.</p><button class="btn primary full" id="save-mode" type="button">Проверить изменения</button><p class="status" id="settings-status" role="status"></p></section><aside class="card"><p class="eyebrow">Программа</p><h2>Силовая база</h2><p class="muted">Продолжительность и типы недель остаются настройками программы.</p></aside></div>`;}
      if(scene==='preview')return `<p class="eyebrow">План · текущая программа</p><h1 class="heading">Проверьте изменения</h1><p class="lede">Переход на режим «По очереди»</p><div class="divider"></div><div class="layout"><section class="card"><h2>Что изменится</h2><ul class="detail-list"><li><strong>Первая в очереди</strong><span class="muted">${chosenDay||'Грудь и трицепс'} · выбранный день</span></li><li><strong>Будущие тренировки</strong><span class="muted">Даты расписания больше не определяют очередь.</span></li><li><strong>Напоминания</strong><span class="muted">Напоминания о двух будущих тренировках отменятся. Личные напоминания сохранятся.</span></li><li><strong>История</strong><span class="muted">Выполненные тренировки и подходы сохранятся.</span></li></ul><button class="btn primary full" id="confirm-mode">Подтвердить выбор</button><button class="btn full" id="back-mode" style="margin-top:8px">Назад к настройкам</button><p class="status" id="action-status" role="status"></p></section><aside class="card"><h2>Периодизация</h2><p class="muted">Если план недели нельзя определить однозначно, приложение попросит уточнить его до тренировки.</p></aside></div>`;
      if(scene==='empty')return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div><section class="card"><h2>В программе нет тренировочных дней</h2><p class="muted">Добавьте хотя бы один день, чтобы выбрать тренировку по очереди.</p><button class="btn primary full" style="margin-top:16px" id="empty-action">Открыть программу</button></section>`;
      if(scene==='cancel')return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div><div class="layout"><section class="card"><p class="eyebrow">Начатая тренировка</p><h2>Отменить тренировку?</h2><p class="muted">«Спина и бицепс» останется следующей в очереди. Записанные подходы сохранятся; тренировка не будет отмечена завершённой.</p><div class="stack" style="margin-top:16px"><button class="btn primary" id="keep-workout">Продолжить тренировку</button><button class="btn" id="cancel-workout">Подтвердить отмену</button></div><p class="status" id="action-status" role="status"></p></section>${sequence('Спина и бицепс','Ноги и плечи')}</div>`;
      if(scene==='cancelled')return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div><div class="layout"><section class="card"><p class="eyebrow">Тренировка отменена</p><h2>Спина и бицепс</h2><p class="muted">Записанные подходы сохранены. Эта тренировка остаётся следующей в очереди.</p><button class="btn primary full" style="margin-top:16px" id="restore-workout">Вернуть к выполнению</button></section>${sequence('Спина и бицепс','Ноги и плечи')}</div>`;
      if(scene==='period')return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div><div class="layout"><section class="card"><p class="eyebrow">План тренировки</p><h2>Уточните неделю программы</h2><p class="muted">После перерыва предписания недель могут отличаться. Выберите подходящий план до начала тренировки.</p><div class="notice" style="margin-top:16px"><strong>Очередь не изменилась</strong><p>Следующая — «Спина и бицепс».</p></div><button class="btn primary full" id="choose-week">Выбрать неделю программы</button><p class="status" id="action-status" role="status"></p></section>${sequence('Спина и бицепс','Ноги и плечи')}</div>`;
      if(scene==='error')return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div><section class="card"><h2>Не удалось загрузить тренировку</h2><p class="muted">Проверьте подключение и попробуйте ещё раз. Порядок тренировок не менялся.</p><button class="btn full" style="margin-top:16px" id="retry">Повторить</button><p class="status" id="action-status" role="status"></p></section>`;
      if(scene==='conflict')return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div><div class="layout"><section class="card"><p class="eyebrow">Требуется внимание</p><h2>Программа уже изменилась</h2><p class="muted">Данные на другом устройстве новее. Локальные изменения не удалены и не отправлены повторно.</p><div class="notice warn" style="margin-top:16px"><strong>Проверьте изменения</strong><p>Обновите программу и решите, как поступить с сохранёнными действиями.</p></div><button class="btn primary full" id="review-conflict">Показать актуальную программу</button><p class="status" id="action-status" role="status"></p></section>${sequence('Спина и бицепс','Ноги и плечи')}</div>`;
      const names=['Грудь и трицепс','Спина и бицепс','Ноги и плечи'];const index=((scene==='ready'?0:1)+skipCount)%3;const current=names[index],next=names[(index+1)%3];
      let banner='';if(scene==='gap')banner=`<div class="notice"><strong>С возвращением</strong><p>Последняя тренировка была 7 дней назад. Очередь не изменилась.</p></div>`;
      if(scene==='coach')banner=`<div class="notice"><strong>Программа тренера</strong><p>Состав и порядок дней задаёт тренер. Ваши результаты сохраняются в истории.</p></div>`;
      if(scene==='edit')banner=`<div class="notice warn"><strong>Программа изменилась</strong><p>Тренер обновил будущие дни. Проверьте порядок перед следующей тренировкой.</p><button class="inline-link" style="margin-top:8px" id="review-edit">${editPreview?'Скрыть изменения':'Посмотреть изменения'}</button>${editPreview?'<p>Текущая тренировка: Спина и бицепс. Далее: Ноги и плечи. Начатые тренировки и история сохраняются.</p>':''}</div>`;
      if(scene==='offline')banner=`<div class="notice warn"><strong>${offlineState?'Нет сети':'Связь восстановлена'}</strong><p>${offlineState?'Показаны последние сохранённые данные. Изменить очередь можно после подключения.':'Обновите состояние очереди перед изменением.'}</p><button class="inline-link" id="reconnect" style="margin-top:8px">${offlineState?'Имитировать подключение':'Обновить'}</button></div>`;
      if(scene==='other')banner=`<div class="notice"><strong>Другая тренировка</strong><p>Её результат сохранится в истории. Следующей в очереди останется «Спина и бицепс».</p><button class="inline-link" id="other-action" style="margin-top:8px">Выбрать тренировку</button><div id="other-choice" hidden><p><strong>Ноги и плечи</strong> Вне очереди</p><button class="btn full" id="other-confirm" style="margin-top:8px">Выполнить вне очереди</button></div></div>`;
      if(skipCount)banner=`<div class="notice"><strong>Тренировка пропущена</strong><p>Следующей стала «${current}».</p><button class="inline-link" id="undo-skip" style="margin-top:8px">Вернуть в очередь</button></div>`;
      const partial=scene==='partial';return `<p class="date">Пятница, 6 ноября</p><h1 class="heading">Сегодня</h1><div class="divider"></div>${scene==='coach'?'<p class="client-label">Для себя · Программа тренера</p>':''}<div class="layout"><div>${banner}${hero(current,partial?'В процессе':'Следующая тренировка',partial?'4 из 12 подходов отмечено':'6 упражнений · 18 подходов',partial?'Продолжить тренировку':'Начать тренировку')}${partial?'<p class="small muted">После отмены эта тренировка останется в очереди.</p>':''}</div>${sequence(current,next)}${week}</div>`;
    }
    function render(){setTheme();renderDock();app.innerHTML=content();$('scenario').value=scene;document.querySelectorAll('.desktop-nav button').forEach((button,i)=>button.classList.toggle('active',i===((scene==='settings'||scene==='rotation'||scene==='preview')?1:0)));const bind=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
      bind('order-help',()=>{$('order-explanation').hidden=!$('order-explanation').hidden});bind('skip',showSkip);bind('undo-skip',()=>{skipCount--;render()});bind('review-edit',()=>{editPreview=!editPreview;render()});bind('reconnect',()=>{if(offlineState)offlineState=false;else scene='ready';render()});
      bind('start',()=>{$('action-status').textContent='В прототипе начало тренировки не создаёт записей.'});bind('show-exercises',()=>{$('action-status').textContent='Здесь откроется состав тренировки.'});bind('other-action',()=>{$('other-choice').hidden=!$('other-choice').hidden});bind('other-confirm',()=>{$('action-status').textContent='Пример: другая тренировка выбрана, очередь не изменилась.'});bind('retry',()=>{$('action-status').textContent='Это демонстрация ошибки: подключение к серверу не выполнялось.'});bind('review-conflict',()=>{$('action-status').textContent='В продукте здесь откроется актуальная версия и сохранённые действия.'});bind('keep-workout',()=>{scene='partial';render()});bind('open-cancel',()=>{scene='cancel';render()});bind('cancel-workout',()=>{scene='cancelled';render()});bind('restore-workout',()=>{scene='partial';render()});bind('choose-week',()=>{$('action-status').textContent='Выбор доступных недель зависит от программы и прав пользователя.'});bind('empty-action',()=>{scene='settings';render()});bind('save-mode',()=>{if(document.querySelector('input[name=mode]:checked').value==='rotation'){chosenDay=$('start-day').value;if(!chosenDay){$('settings-status').textContent='Выберите первую тренировку.';$('start-day').focus();return}scene='preview';render()}else $('settings-status').textContent='Режим по расписанию уже выбран.'});bind('confirm-mode',()=>{$('action-status').textContent='В прототипе настройки программы не изменяются.'});bind('back-mode',()=>{scene='rotation';render()});
      document.querySelectorAll('input[name=mode]').forEach(input=>input.addEventListener('change',()=>{$('mode-description').textContent=input.value==='rotation'?'Следующая тренировка определяется порядком дней, а не датой. Отдых не сдвигает очередь.':'Тренировки показываются по дням календарного расписания.';$('mode-preview').hidden=input.value!=='rotation'}));
    }
    function showSkip() {const names=['Грудь и трицепс','Спина и бицепс','Ноги и плечи'];const index=((scene==='ready'?0:1)+skipCount)%3;$('skip-current').textContent=names[index];$('skip-next').textContent=names[(index+1)%3];$('confirm').showModal()}
    select.addEventListener('change',()=>{scene=select.value;skipCount=scene==='skipped'?1:0;editPreview=false;offlineState=true;render();if(scene==='skip')showSkip()});$('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()});$('cancel-skip').addEventListener('click',()=>$('confirm').close());$('confirm-skip').addEventListener('click',()=>{$('confirm').close();skipCount++;render()});render();if(scene==='skip')showSkip();
  </script>
</body>
</html>
