:root{color-scheme:dark;--canvas:#090b0b;--surface:#141717;--secondary:#1b1f1f;--text:#f5f5f5;--muted:#b8b8b8;--border:#404040;--accent:#b2f520;--accent-text:#b9ea72;--on:#090b0b;--warning:#e5b963;--warning-bg:#2b2314;--danger:#ef7474;--danger-bg:#2c1717}

:root{--focus:#b2f520;--choice-surface:linear-gradient(180deg,#3b4436,#2a3028);--choice-outline:#778e55;--choice-ink:#d9f9b5;--choice-relief:inset 0 0 0 1px var(--choice-outline),inset 0 1px 0 rgb(255 255 255 / 30%),inset 0 -1px 0 rgb(0 0 0 / 28%),0 2px 5px rgb(0 0 0 / 18%)}
:root[data-theme=light]{--focus:#111;--choice-surface:linear-gradient(180deg,#f7ffe8,#dbeeb7);--choice-outline:#758b50;--choice-ink:#334612;--choice-relief:inset 0 0 0 1px var(--choice-outline),inset 0 1px 0 rgb(255 255 255 / 90%),inset 0 -1px 0 rgb(52 72 20 / 12%),0 2px 5px rgb(25 40 15 / 10%)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}button,input,select{font:inherit}button,input,select{min-height:44px}button,select,input{border-radius:14px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button:disabled{opacity:.55;cursor:default}
.reviewbar{padding:8px 12px;background:#202525;color:#f5f5f5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}.reviewbar select{min-height:34px;background:#fff;color:#151515;border:0;padding:0 8px}.reviewbar strong{margin-right:auto}.reviewbar label{display:flex;align-items:center;gap:6px}
main{max-width:784px;margin:12px auto 28px;padding:0 12px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Oswald,'Arial Narrow',sans-serif;line-height:1.2}h1{font-size:23px}h2{font-size:18px}h3{font-size:16px}.head{display:flex;align-items:center;gap:12px;margin:12px 0 20px}.head h1{font-family:Inter,sans-serif;font-size:17px;line-height:1.35}.back{color:var(--text);background:transparent;border:0;padding:0 2px;min-width:50px;text-align:left}.small{color:var(--muted);font-size:13px}.hint{color:var(--muted);font-size:14px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin:0 0 16px}.panel>h2+.hint,.panel>h3+.hint{margin-top:7px}.stack>*+*{margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row>*{min-width:0}.field{display:grid;gap:6px;min-width:0}.field label,.caption{font-size:12px;font-weight:700}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.fields .field{min-width:0}input:not([type=checkbox]):not([type=radio]),select{width:100%;padding:8px 12px;background:var(--surface);color:var(--text);border:1px solid var(--border)}.choice{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 10px;border-radius:14px}.choice:has(input:checked){background:var(--choice-surface);box-shadow:var(--choice-relief);color:var(--choice-ink)}.choice input{accent-color:var(--accent);width:20px;height:20px;min-height:20px;margin:2px 0 0;flex:none}.choice span{display:grid;gap:3px}.choice strong{font-size:15px}.choice small{font-size:13px;color:var(--muted)}.divider{border:0;border-top:1px solid var(--border);margin:16px 0}
.weeks{margin-top:12px;border-top:1px solid var(--border)}.weekrow{display:grid;grid-template-columns:minmax(80px,1fr) minmax(132px,1fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}.weekrow label{font-weight:600}.weekrow select{font-size:14px}.labelblock{display:grid;gap:3px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--accent-text);background:var(--secondary);width:max-content}.primary,.secondary{border:1px solid var(--border);padding:10px 14px;font-weight:700}.primary{width:100%;background:var(--accent);color:var(--on);border-color:var(--accent)}.secondary{background:var(--surface);color:var(--text)}.textbutton{border:0;padding:8px 0;min-height:44px;background:transparent;color:var(--text);font-weight:700}.listrow{padding:12px 0;border-top:1px solid var(--border)}.listrow:first-of-type{border-top:0}.listrow h3{font:700 15px/1.4 Inter,sans-serif}.listrow p{font-size:13px;color:var(--muted);margin-top:4px}.callout{border:1px solid var(--border);background:var(--secondary);border-radius:14px;padding:12px;font-size:14px}.warning{background:var(--warning-bg);border-color:var(--warning)}.warning strong{color:var(--warning)}.error{background:var(--danger-bg);border-color:var(--danger)}.error strong{color:var(--danger)}.foot{margin:18px 0;color:var(--muted);font-size:13px}.editor{border:1px solid var(--border);border-radius:20px;padding:12px;background:var(--surface)}.step{font-size:12px;color:var(--accent-text);font-weight:700;margin-top:12px}.day{border:1px solid var(--accent-text);border-radius:18px;background:var(--secondary);padding:22px;text-align:center}.day b{display:block;font-size:20px;margin:8px 0}.simpleline{border:1px solid var(--border);border-radius:14px;padding:12px}.simpleline h3{font:700 15px Inter}.simpleline p{font-size:13px;color:var(--muted);margin-top:4px}.loader{height:14px;border-radius:6px;background:var(--secondary);margin:12px 0}.loader.short{width:55%}
@media(max-width:400px){main{padding:0 10px}.panel{padding:14px}.fields{gap:8px}.weekrow{grid-template-columns:minmax(76px,1fr) minmax(128px,1fr);gap:8px}.head{margin-bottom:16px}}
</style></head>
<body><div class="reviewbar"><strong>МАКЕТ · Issue #918 · синтетические данные</strong><label>Состояние <select id="views"></select></label><label>Тема <select id="themes"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label></div><main id="app"></main>
<script>
const options={
 editor:'Редактор: день в центре',off:'Периодизация выключена',setup:'Настройка 3 / 16',one:'Одна исходная неделя / 16',oneoff:'Цикл без повтора',seven:'Семь недель и соседние тяжёлые',preview:'Предпросмотр повторений',sevenpreview:'Семь исходных недель / 16',thirty:'Три исходных недели / 30',source:'Тренировка исходной недели',scope:'Правка: только одна неделя',scoperepeat:'Правка: будущие повторы',scopeselected:'Правка: выбранные недели',disable:'Выключение периодизации',impact:'Проверка перед применением',duration:'Изменение срока',typescope:'Изменение типа будущей недели',typeimpact:'Проверка изменения типа',disableactive:'Отключение действующей программы',invalid:'Срок больше цикла без повтора',coach:'Тренер: программа клиента',athlete:'Спортсмен: программа тренера',empty:'Пустая / прежняя программа',imported:'Импорт: ручной выбор типа',loading:'Загрузка',error:'Ошибка загрузки',conflict:'План изменился',progress:'Фактическая прогрессия',nohistory:'Недостаточно данных'
};
const q=new URLSearchParams(location.search);const view=options[q.get('view')]?q.get('view'):'setup';const theme=q.get('theme')==='light'?'light':'dark';document.documentElement.dataset.theme=theme;
const views=document.getElementById('views');for(const [key,value] of Object.entries(options)){const o=document.createElement('option');o.value=key;o.textContent=value;views.append(o)}views.value=view;document.getElementById('themes').value=theme;
function change(){location.search='?view='+views.value+'&theme='+document.getElementById('themes').value}views.addEventListener('change',change);document.getElementById('themes').addEventListener('change',change);
const header=(name)=>'<div class="head"><button class="back" type="button">Назад</button><h1>'+name+'</h1></div>';
const panel=(content)=>'<section class="panel">'+content+'</section>';
const button=(text,kind='primary')=>'<button type="button" class="'+kind+'">'+text+'</button>';
const hint=(text)=>'<p class="hint">'+text+'</p>';
const choice=(title,description,checked,type='checkbox',name='choice')=>'<label class="choice" data-yfc-choice><input type="'+type+'" name="'+name+'" '+(checked?'checked':'')+'><span><strong>'+title+'</strong><small>'+description+'</small></span></label>';
const field=(label,value)=>'<div class="field"><label>'+label+'<input type="number" value="'+value+'" min="1" inputmode="numeric"></label></div>';
const weekRows=(values)=>'<div class="weeks">'+values.map((v,i)=>'<div class="weekrow"><label for="w'+i+'">Неделя '+(i+1)+'</label><select id="w'+i+'"><option'+(v==='Не задан'?' selected':'')+'>Не задан</option><option'+(v==='Лёгкая'?' selected':'')+'>Лёгкая</option><option'+(v==='Средняя'?' selected':'')+'>Средняя</option><option'+(v==='Тяжёлая'?' selected':'')+'>Тяжёлая</option></select></div>').join('')+'</div>';
const weekList=(items)=>items.map(item=>'<div class="listrow"><h3>Неделя '+item[0]+' <span class="small">· Исходная '+item[1]+' · Проход '+item[2]+'</span></h3><p>'+item[3]+' · Пн: Тренировка 1 · Ср: Тренировка 2</p></div>').join('');
const cycle=(k,n,repeat,types)=>panel('<div class="stack"><div><h2>Периодизация</h2>'+hint('Настройте исходные недели и при необходимости повторите их.')+'</div>'+choice('Включить периодизацию','Можно оставить тип недели незаданным.',true)+'<div class="fields">'+field('Исходных недель',k)+field('Всего недель',n)+'</div>'+choice('Повторять исходный цикл','Порядок исходных недель повторяется до конца программы.',repeat)+'<div><h3>Типы исходных недель</h3><p class="small">Тип не меняет нагрузку автоматически.</p>'+weekRows(types)+'</div>'+button('Посмотреть план на '+n+' недель','secondary')+'</div>');
const weekLabel=(k)=>{const last=k%10, lastTwo=k%100;return lastTwo>=11&&lastTwo<=14?'исходных недель':last===1?'исходная неделя':last>=2&&last<=4?'исходные недели':'исходных недель'};
const preview=(k,n,items)=>panel('<div class="row"><div><h2>План на '+n+' недель</h2><p class="small">'+k+' '+weekLabel(k)+' · повтор включён</p></div></div><div class="weeks">'+weekList(items)+'</div><p class="small" style="margin-top:12px">Показаны отдельные недели. Все недели доступны в полном списке.</p><button class="textbutton" type="button">Показать все '+n+' недель</button>');
let content='';
if(view==='editor')content='<div class="editor"><h2>Создать свою программу</h2><div class="step">ШАГ 1</div><h3>Основа программы</h3><div class="field" style="margin-top:10px"><label>Название<input value="Моя программа"></label></div><div class="step">ШАГ 2</div><h3>Тренировочные дни</h3><div class="row" style="margin:20px 0"><h3>Дни</h3><button class="textbutton">Все дни</button></div><div class="day"><span class="caption" style="color:var(--accent-text)">ДЕНЬ 1 ИЗ 2</span><b>Тренировка 1</b><span class="small">2 упр. · тренировочный день</span></div><p style="text-align:center;font-weight:700;margin:16px">День 1 из 2</p><div class="simpleline"><h3>Приседания со штангой</h3><p>3 подхода × 8–10 повторов</p></div><button class="textbutton" style="width:100%">Добавить упражнение</button><button class="textbutton" style="width:100%">Добавить день</button><div class="simpleline"><h3>Настройки программы</h3><p>Цель, расписание и периодизация</p></div><div class="step">ШАГ 3</div><p style="margin:8px 0">2 тренировки · 2 упр.</p>'+button('Проверить и назначить')+'</div>';
if(view==='off')content=header('Настройки программы')+panel('<div class="stack"><div><h2>Цель и уровень</h2>'+hint('Для чего и какой уровень подготовки')+'</div><div class="row"><b>Цель</b><span>Набор</span></div><div class="row"><b>Уровень</b><span>Начальный</span></div></div>')+panel('<h2>Расписание</h2>'+hint('Когда начинать и как часто тренироваться.')+'<div class="fields">'+field('Длительность, недель',16)+'<div class="field"><label>Начать не раньше<input type="date" value="2026-11-02"></label></div></div>')+panel('<div class="stack"><div><h2>Периодизация</h2>'+hint('Необязательно. Настройте исходные недели и их повторение.')+'</div>'+choice('Включить периодизацию','Пока выключена: программа работает как прежде.',false)+'</div>')+'<p class="foot">Настройки войдут в программу при её сохранении.</p>'+button('Сохранить настройки');
if(view==='setup')content=header('Настройки программы')+cycle(3,16,true,['Тяжёлая','Тяжёлая','Не задан'])+'<p class="foot">Настройки войдут в программу при её сохранении.</p>'+button('Сохранить настройки');
if(view==='one')content=header('Периодизация')+cycle(1,16,true,['Не задан'])+preview(1,16,[[1,1,1,'Тип не задан'],[16,1,16,'Тип не задан']]);
if(view==='oneoff')content=header('Периодизация')+cycle(3,3,false,['Лёгкая','Тяжёлая','Не задан'])+panel('<h3>Без повтора</h3><p class="hint">Программа закончится после последней выбранной недели. Чтобы продлить её дальше исходного цикла, включите повтор.</p>');
if(view==='seven')content=header('Периодизация')+cycle(7,16,true,['Лёгкая','Тяжёлая','Тяжёлая','Не задан','Средняя','Тяжёлая','Лёгкая']);
if(view==='preview')content=header('Предпросмотр программы')+preview(3,16,[[1,1,1,'Тяжёлая'],[2,2,1,'Тяжёлая'],[3,3,1,'Тип не задан'],[15,3,5,'Тип не задан'],[16,1,6,'Тяжёлая']])+panel('<div class="callout"><strong>Неделя 16</strong><p>Исходная неделя 1 · проход 6</p></div>')+button('Вернуться к настройкам','secondary');
if(view==='source')content=header('Исходная неделя 2')+panel('<div class="stack"><div><span class="pill">Тяжёлая неделя</span><h2 style="margin-top:10px">Тренировочные дни</h2>'+hint('Эта неделя входит в исходный цикл.')+'</div><div class="row"><b>Дни</b><button class="textbutton">Все дни</button></div><div class="day"><span class="caption" style="color:var(--accent-text)">ДЕНЬ 1 ИЗ 2</span><b>Тренировка 1</b><span class="small">2 упражнения</span></div><div class="simpleline"><h3>Приседания со штангой</h3><p>4 подхода × 6–8 повторов</p></div><button class="textbutton">Изменить упражнение</button></div>')+button('Готово');
if(['scope','scoperepeat','scopeselected'].includes(view))content=header('Изменить будущий план')+panel('<div class="stack"><div><h2>Приседания со штангой</h2>'+hint('Тренировка 1 · исходная неделя 1')+'</div><div class="fields">'+field('Подходы',4)+'<div class="field"><label>Повторы<input value="6–8"></label></div></div><h3>К каким неделям применить?</h3>'+choice('Только неделя 7','Одно выбранное вхождение.',view==='scope','radio','scope')+choice('Будущие повторы недели 1','Недели 7, 10, 13 и 16.',view==='scoperepeat','radio','scope')+choice('Выбрать будущие недели','Отметьте конкретные вхождения.',view==='scopeselected','radio','scope')+(view==='scopeselected'?'<div class="callout">'+choice('Неделя 7 · 14 декабря','Тренировка 1',true)+choice('Неделя 10 · 4 января','Тренировка 1',false)+choice('Неделя 13 · 25 января','Тренировка 1',true)+choice('Неделя 16 · 15 февраля','Тренировка 1',false)+'</div>':'')+button('Проверить изменения')+'</div>');
if(view==='disable')content=header('Периодизация')+panel('<div class="stack"><h2>Выключить периодизацию?</h2><p class="hint">После сохранения в шаблоне не будут использоваться типы недель и повторение цикла.</p><div class="callout warning"><strong>История сохранится</strong><p>Уже выполненные тренировки и фактические подходы не изменятся.</p></div>'+button('Выключить периодизацию')+button('Оставить включённой','secondary')+'</div>');
if(view==='impact')content=header('Проверить изменения')+panel('<div class="stack"><div><h2>Изменятся будущие тренировки</h2>'+hint('Приседания со штангой · 4 подхода × 6–8')+'</div><div class="callout warning"><strong>История сохранится</strong><p>Завершённые и начатые тренировки не будут изменены. Для начатой тренировки используйте доступное редактирование в ней.</p></div><h3>Затронутые недели</h3><div class="weeks">'+[[7,3,'14 декабря'],[10,4,'4 января'],[13,5,'25 января'],[16,6,'15 февраля']].map(w=>'<div class="listrow"><h3>Неделя '+w[0]+' <span class="small">· Исходная 1 · Проход '+w[1]+'</span></h3><p>'+w[2]+' · Тренировка 1 · запланирована</p></div>').join('')+'</div><p class="small">Даты и состав проверяются перед применением. Если план изменился, откройте проверку заново.</p>'+button('Применить изменения')+button('Вернуться','secondary')+'</div>');
if(view==='duration')content=header('Изменить срок программы')+panel('<div class="stack"><h2>Продолжительность</h2><p class="hint">Сейчас 16 недель. Изменение относится к будущему плану.</p><div class="fields">'+field('Всего недель',20)+field('Начиная с недели',7)+'</div><div class="callout warning"><strong>Прошлые тренировки сохранятся</strong><p>Начатые тренировки не изменятся. Перед сохранением проверьте затронутые недели.</p></div>'+button('Проверить изменения')+'</div>');
if(view==='coach')content=header('Программа клиента')+panel('<div class="stack"><div><span class="pill">Клиент · Анна Петрова</span><h2 style="margin-top:10px">Программа тренировок</h2>'+hint('Вы настраиваете программу для клиента.')+'</div>'+choice('Включить периодизацию','Типы и повторение задаются для этой программы.',true)+'<div class="fields">'+field('Исходных недель',3)+field('Всего недель',16)+'</div>'+choice('Повторять исходный цикл','До конца срока программы.',true)+'<h3>Типы исходных недель</h3>'+weekRows(['Тяжёлая','Тяжёлая','Не задан'])+button('Проверить и назначить')+'</div>');
if(view==='athlete')content=header('Моя программа')+panel('<div class="stack"><div><span class="pill">Программа тренера</span><h2 style="margin-top:10px">Программа тренировок</h2>'+hint('Неделя 7 из 16 · исходная неделя 1 · проход 3')+'</div><div class="callout"><strong>Тяжёлая неделя</strong><p>План подготовлен тренером. Изменения шаблона согласуйте с тренером.</p></div><h3>Тренировки на неделе</h3><div class="simpleline"><h3>Тренировка 1</h3><p>Понедельник · 2 упражнения</p></div>'+button('Посмотреть план','secondary')+'</div>');
