name: Temporary Issue 997 Formatter

on:
  push:
    branches:
      - codex/issue-997-program-preview-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-997-program-preview-implementation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format changed Issue 997 sources only
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx prettier --write src/features/programs/TemplatesList.tsx src/features/programs/programPreviewFacts.ts src/features/programs/programPreview.css tests/unit/features/programs/programPreviewFacts.test.ts
      - name: Push formatting commit if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/programs/TemplatesList.tsx frontend/src/features/programs/programPreviewFacts.ts frontend/src/features/programs/programPreview.css frontend/tests/unit/features/programs/programPreviewFacts.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(#997): apply repository Prettier formatting'
            git push origin HEAD:codex/issue-997-program-preview-implementation
          fi
