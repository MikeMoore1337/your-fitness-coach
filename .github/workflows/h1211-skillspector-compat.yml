name: YFC H-1211 pinned SkillSpector compatibility (isolated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/skillspector_guard.py
      - scripts/h1211_skillspector_smoke.py
      - tests/test_skillspector_guard.py
      - .github/workflows/h1211-skillspector-compat.yml

permissions:
  contents: read

jobs:
  pinned-static-ru-en:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout without retaining repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned Python 3.13 for upstream scanner compatibility
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned uv tool runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.32'
      - name: Verify real upstream --output contract and RU/EN no-LLM static verdicts
        shell: bash
        env:
          PYTHONUTF8: '1'
          UV_NO_PROGRESS: '1'
        run: |
          set -euo pipefail
          python -m scripts.h1211_skillspector_smoke
          echo "H1211_PINNED_STATIC_REAL_${{ matrix.os }}=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "H1211_NO_PRODUCT_RUNTIME=TRUE" >> "$GITHUB_STEP_SUMMARY"
