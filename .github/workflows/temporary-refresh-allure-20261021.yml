name: Temporary audited Allure report lock refresh
on:
  push:
    branches:
      - design/impeccable-first-class-20261021
permissions:
  contents: write
jobs:
  refresh-report-lock:
    if: github.ref == 'refs/heads/design/impeccable-first-class-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Regenerate scheduled-report lockfile
        working-directory: frontend/scheduled-report
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Validate pinned scheduled-report dependencies
        working-directory: frontend/scheduled-report
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Commit safe lockfile refresh
        run: |
          git add -- frontend/scheduled-report/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="GitHub Actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(deps): pin secure Vite in scheduled Allure reporting lock"
          git push origin HEAD:refs/heads/design/impeccable-first-class-20261021
