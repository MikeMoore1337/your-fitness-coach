name: YFC #1211 pinned SkillSpector cross-OS acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/skillspector_guard.py'
      - 'scripts/yfc_1211_live_probe.py'
      - 'tests/test_skillspector_guard.py'
      - '.github/workflows/skillspector-1211-acceptance.yml'
      - 'docs/skillspector-development.md'
  push:
    branches: [master]
    paths:
      - 'scripts/skillspector_guard.py'
      - 'scripts/yfc_1211_live_probe.py'
      - 'tests/test_skillspector_guard.py'
      - '.github/workflows/skillspector-1211-acceptance.yml'
      - 'docs/skillspector-development.md'

permissions:
  contents: read

jobs:
  static-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Real pinned SkillSpector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.32'
      - name: Real pinned scanner, synthetic EN/RU skills, static only
        shell: bash
        env:
          UV_NO_PROGRESS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          uvx --version
          python -m scripts.yfc_1211_live_probe
          echo "YFC_1211_REAL_SCAN=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "YFC_1211_LLM_API=NOT_USED" >> "$GITHUB_STEP_SUMMARY"
          echo "YFC_1211_PRODUCTION_ACTIVATION=NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
