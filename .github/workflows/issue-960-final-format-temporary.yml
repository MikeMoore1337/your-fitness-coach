name: Issue 960 final temporary formatter
on:
  push:
    branches: [codex/issue-960-rest-implementation]
    paths:
      - .github/workflows/issue-960-final-format-temporary.yml
permissions:
  contents: write
jobs:
  finish-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-960-rest-implementation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Apply standard frontend formatting
        working-directory: frontend
        run: npx prettier --write src/features/workouts/restSessions.ts tests/unit/features/workouts/RestSessions.test.ts
      - name: Push formatter-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/workouts/restSessions.ts frontend/tests/unit/features/workouts/RestSessions.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "chore(#960): final Prettier normalization"
            git push origin HEAD:codex/issue-960-rest-implementation
          fi
