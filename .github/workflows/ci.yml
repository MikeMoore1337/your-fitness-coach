name: CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [master]
  schedule:
    # Europe/Moscow: daily at 05:17.
    - cron: "17 2 * * *"
    # Europe/Moscow: weekly Sunday at 06:43.
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      run_kind:
        description: Scheduled regression tier
        required: true
        default: daily
        type: choice
        options: [daily, weekly]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/runtime/cache/uv
  UV_SYSTEM_PYTHON: "1"

jobs:
  scope-router:
    name: CI scope router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      required_groups: ${{ steps.route.outputs.required_groups }}
      required_jobs: ${{ steps.route.outputs.required_jobs }}
      skipped_groups: ${{ steps.route.outputs.skipped_groups }}
      changed_paths: ${{ steps.route.outputs.changed_paths }}
      run_quality: ${{ steps.route.outputs.run_quality }}
      run_policy: ${{ steps.route.outputs.run_policy }}
      run_frontend: ${{ steps.route.outputs.run_frontend }}
      run_frontend_smoke: ${{ steps.route.outputs.run_frontend_smoke }}
      run_frontend_mobile_regression: ${{ steps.route.outputs.run_frontend_mobile_regression }}
      run_frontend_mobile_regression_extended: ${{ steps.route.outputs.run_frontend_mobile_regression_extended }}
      run_frontend_cross_browser: ${{ steps.route.outputs.run_frontend_cross_browser }}
      run_python: ${{ steps.route.outputs.run_python }}
      run_migrated_stack: ${{ steps.route.outputs.run_migrated_stack }}
      run_dependency_audit: ${{ steps.route.outputs.run_dependency_audit }}
      run_full_dependency_audit: ${{ steps.route.outputs.run_full_dependency_audit }}
      run_frontend_dependency_audit: ${{ steps.route.outputs.run_frontend_dependency_audit }}
      run_python_dependency_audit: ${{ steps.route.outputs.run_python_dependency_audit }}
      run_containers: ${{ steps.route.outputs.run_containers }}
      run_critical_smoke: ${{ steps.route.outputs.run_critical_smoke }}
      run_workflow_contracts: ${{ steps.route.outputs.run_workflow_contracts }}
      run_workflow_config: ${{ steps.route.outputs.run_workflow_config }}
      run_image_contract: ${{ steps.route.outputs.run_image_contract }}
      run_deployment_contract: ${{ steps.route.outputs.run_deployment_contract }}
      run_merge_provenance: ${{ steps.route.outputs.run_merge_provenance }}
      run_scheduled_report: ${{ steps.route.outputs.run_scheduled_report }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Route exact repository scope
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_KIND: ${{ inputs.run_kind || '' }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$TARGET_REF" = refs/heads/master
          fi
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = pull_request_review ]; then
            python scripts/ci_contract.py route \
              --event pull_request \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = schedule ]; then
            python scripts/ci_contract.py route \
              --event "$EVENT_NAME" \
              --schedule-cron "$SCHEDULE_CRON" \
              --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/ci_contract.py route \
              --event "$EVENT_NAME" \
              --run-kind "$RUN_KIND" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci_contract.py route \
              --event "$EVENT_NAME" \
              --github-output "$GITHUB_OUTPUT"
          fi

  task-provenance:
    name: Task provenance
    needs: scope-router
    if: github.event_name == 'pull_request' && needs.scope-router.result == 'success' || github.event_name == 'pull_request_review' && needs.scope-router.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate task provenance or trusted Dependabot identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/task_session.py validate-pr --event "$GITHUB_EVENT_PATH"

  review-contract:
    name: Review before merge
    needs: [scope-router, task-provenance]
    if: github.event_name == 'pull_request' && needs.scope-router.result == 'success' && needs.task-provenance.result == 'success' || github.event_name == 'pull_request_review' && needs.scope-router.result == 'success' && needs.task-provenance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Require exact-head completed review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/task_session.py validate-pr-review --event "$GITHUB_EVENT_PATH"

  merge-provenance:
    name: Merged master provenance
    needs: scope-router
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.scope-router.result == 'success' && needs.scope-router.outputs.run_merge_provenance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify exact merged task PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/task_session.py verify-master-merge --sha "$GITHUB_SHA"

  quality:
    name: Python quality
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.artifacts/runtime/cache/pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1
      - name: Run shared quality group
        run: python scripts/ci_contract.py run-group quality

  policy:
    name: Delivery policy
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-dev.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: policy
      - name: Install Python dependencies
        run: uv pip install -r backend/requirements-dev.txt -r bot/requirements.txt
      - name: Prepare pytest runtime directories
        run: mkdir -p .artifacts/runtime/tests
      - name: Run shared delivery policy group
        run: python scripts/ci_contract.py run-group policy

  frontend:
    name: Frontend
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/frontend-checks', github.workspace) || '' }}
      ALLURE_VITEST_REPORTER_PATH: ${{ github.workspace }}/frontend/scheduled-report/node_modules/allure-vitest/dist/reporter.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Report npm cache
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/requirements-runtime.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install scheduled Vitest reporter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        working-directory: frontend
        run: npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Install API schema dependencies
        run: uv pip install -r backend/requirements-runtime.txt
      - name: Run shared frontend checks group
        run: python scripts/ci_contract.py run-group frontend-checks
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/frontend-checks.enc
          artifact-name: allure-results-${{ github.run_id }}-frontend-checks
          suite: frontend-checks
          browser: node-unit

  frontend-smoke:
    name: Frontend smoke (${{ matrix.shard }}/4)
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_frontend_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/frontend-e2e-shard-{1}', github.workspace, matrix.shard) || '' }}
      ALLURE_PLAYWRIGHT_REPORTER_PATH: ${{ github.workspace }}/frontend/scheduled-report/node_modules/allure-playwright

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        with:
          python-version: "3.14"
      - name: Report npm cache
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install scheduled Playwright reporter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        working-directory: frontend
        run: npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Build frontend for smoke tests
        working-directory: frontend
        run: npx vite build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run shared frontend E2E group
        run: python scripts/ci_contract.py run-group frontend-e2e --shard "${{ matrix.shard }}/4"
      - name: Upload Playwright traces on failure
        if: failure() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: .artifacts/runtime/tests/playwright
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/frontend-e2e-shard-${{ matrix.shard }}.enc
          artifact-name: allure-results-${{ github.run_id }}-frontend-e2e-shard-${{ matrix.shard }}
          suite: frontend-e2e
          browser: chromium-shard-${{ matrix.shard }}

  frontend-mobile-regression:
    name: Mobile regression (Chromium + WebKit)
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_frontend_mobile_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_TIMING_FILE: ${{ github.workspace }}/.artifacts/runtime/ci/mobile-regression-timing.jsonl
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/frontend-mobile-regression', github.workspace) || '' }}
      ALLURE_PLAYWRIGHT_REPORTER_PATH: ${{ github.workspace }}/frontend/scheduled-report/node_modules/allure-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Report npm cache
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: python ../scripts/ci_timing.py --group frontend-mobile-regression --command npm-ci -- npm ci
      - name: Install scheduled Playwright reporter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        working-directory: frontend
        run: npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Build frontend preview
        working-directory: frontend
        run: python ../scripts/ci_timing.py --group frontend-mobile-regression --command vite-build -- npx vite build
      - name: Cache mobile Playwright browsers
        id: mobile-playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-mobile-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Report mobile Playwright cache
        run: echo "CI_CACHE package=playwright-mobile hit=${{ steps.mobile-playwright-cache.outputs.cache-hit }}"
      - name: Install mobile Chromium and WebKit
        working-directory: frontend
        run: python ../scripts/ci_timing.py --group frontend-mobile-regression --command playwright-install -- npx playwright install --with-deps chromium webkit
      - name: Run shared mobile regression group
        run: python scripts/ci_contract.py run-group frontend-mobile-regression
      - name: Upload mobile regression evidence
        if: always() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-regression-${{ github.run_id }}
          path: |
            .artifacts/runtime/ci/mobile-regression-timing.jsonl
            .artifacts/runtime/tests/playwright-mobile-regression
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/frontend-mobile-regression.enc
          artifact-name: allure-results-${{ github.run_id }}-frontend-mobile-regression
          suite: frontend-mobile-regression
          browser: mobile-chromium-webkit

  frontend-mobile-regression-extended:
    name: Extended mobile regression (Firefox + WebKit)
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_frontend_mobile_regression_extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_TIMING_FILE: ${{ github.workspace }}/.artifacts/runtime/ci/mobile-regression-extended-timing.jsonl
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/frontend-mobile-regression-extended', github.workspace) || '' }}
      ALLURE_PLAYWRIGHT_REPORTER_PATH: ${{ github.workspace }}/frontend/scheduled-report/node_modules/allure-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Report npm cache
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: python ../scripts/ci_timing.py --group frontend-mobile-regression-extended --command npm-ci -- npm ci
      - name: Install scheduled Playwright reporter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        working-directory: frontend
        run: npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Build frontend preview
        working-directory: frontend
        run: python ../scripts/ci_timing.py --group frontend-mobile-regression-extended --command vite-build -- npx vite build
      - name: Cache extended mobile Playwright browsers
        id: extended-playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-mobile-extended-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Report extended Playwright cache
        run: echo "CI_CACHE package=playwright-mobile-extended hit=${{ steps.extended-playwright-cache.outputs.cache-hit }}"
      - name: Install extended mobile Firefox and WebKit
        working-directory: frontend
        run: python ../scripts/ci_timing.py --group frontend-mobile-regression-extended --command playwright-install -- npx playwright install --with-deps firefox webkit
      - name: Run shared extended mobile regression group
        run: python scripts/ci_contract.py run-group frontend-mobile-regression-extended
      - name: Upload extended mobile regression evidence
        if: always() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-regression-extended-${{ github.run_id }}
          path: |
            .artifacts/runtime/ci/mobile-regression-extended-timing.jsonl
            .artifacts/runtime/tests/playwright-mobile-regression-extended
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/frontend-mobile-regression-extended.enc
          artifact-name: allure-results-${{ github.run_id }}-frontend-mobile-regression-extended
          suite: frontend-mobile-regression-extended
          browser: mobile-firefox-webkit

  frontend-cross-browser:
    name: Weekly cross-browser regression (Chromium + Firefox + WebKit)
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_frontend_cross_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/frontend-cross-browser', github.workspace) || '' }}
      ALLURE_PLAYWRIGHT_REPORTER_PATH: ${{ github.workspace }}/frontend/scheduled-report/node_modules/allure-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Report npm cache
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install scheduled Playwright reporter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        working-directory: frontend
        run: npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Build frontend preview
        working-directory: frontend
        run: npx vite build
      - name: Cache cross-browser Playwright browsers
        id: cross-browser-playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cross-browser-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Report cross-browser Playwright cache
        run: echo "CI_CACHE package=playwright-cross-browser hit=${{ steps.cross-browser-playwright-cache.outputs.cache-hit }}"
      - name: Install cross-browser Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run shared cross-browser regression group
        run: python scripts/ci_contract.py run-group frontend-cross-browser
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/frontend-cross-browser.enc
          artifact-name: allure-results-${{ github.run_id }}-frontend-cross-browser
          suite: frontend-cross-browser
          browser: chromium-firefox-webkit

  python-tests:
    name: Python tests (${{ matrix.shard }}/4)
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/python-tests-shard-{1}', github.workspace, matrix.shard) || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-dev.txt
            backend/requirements-scheduled-report.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: python-tests
      - name: Install Python dependencies
        run: uv pip install -r backend/requirements-dev.txt -r bot/requirements.txt
      - name: Install scheduled Pytest Allure adapter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        run: uv pip install -r backend/requirements-scheduled-report.txt
      - name: Run shared Python tests group
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters
        run: python scripts/ci_contract.py run-group python-tests --shard "${{ matrix.shard }}/4"
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/python-tests-shard-${{ matrix.shard }}.enc
          artifact-name: allure-results-${{ github.run_id }}-python-tests-shard-${{ matrix.shard }}
          suite: python-tests
          browser: python-shard-${{ matrix.shard }}

  migrated-stack:
    name: Migrated PostgreSQL stack
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_migrated_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_RESULTS_DIR: ${{ needs.scope-router.outputs.run_scheduled_report == 'true' && format('{0}/.artifacts/runtime/tests/allure-results/migrated-stack', github.workspace) || '' }}
      ALLURE_PLAYWRIGHT_REPORTER_PATH: ${{ github.workspace }}/frontend/scheduled-report/node_modules/allure-playwright
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitminiapp_test
          POSTGRES_USER: fitminiapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitminiapp -d fitminiapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Report npm cache
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-dev.txt
            backend/requirements-scheduled-report.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: migrated-stack
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install stack dependencies
        run: |
          uv pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci
      - name: Install scheduled Pytest Allure adapter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        run: uv pip install -r backend/requirements-scheduled-report.txt
      - name: Install scheduled Playwright reporter
        if: needs.scope-router.outputs.run_scheduled_report == 'true'
        working-directory: frontend
        run: npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend preview
        working-directory: frontend
        run: npm run build
      - name: Run shared migrated-stack group
        env:
          RUN_MIGRATED_STACK_TEST: "1"
          APP_ENV: test
          APP_NAME: Your Fitness Coach CI
          APP_DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "30"
          DATABASE_URL: postgresql+psycopg://fitminiapp:test-password@127.0.0.1:5432/fitminiapp_test
          ENABLE_DEV_AUTH: "true"
          TELEGRAM_BOT_TOKEN: test-token
          BOT_INTERNAL_TOKEN: test-bot-internal-token
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters
        run: python scripts/ci_contract.py run-group migrated-stack
      - name: Upload encrypted Allure results
        if: always() && needs.scope-router.outputs.run_scheduled_report == 'true'
        uses: ./.github/actions/upload-allure-results
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        with:
          enabled: "true"
          source: ${{ env.ALLURE_RESULTS_DIR }}
          bundle: .artifacts/runtime/tests/allure-bundles/migrated-stack.enc
          artifact-name: allure-results-${{ github.run_id }}-migrated-stack
          suite: migrated-stack
          browser: chromium-api

  dependency-audit:
    name: Dependency audit
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_dependency_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: npm-setup
        if: needs.scope-router.outputs.run_frontend_dependency_audit == 'true' || needs.scope-router.outputs.run_full_dependency_audit == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Report npm cache
        if: needs.scope-router.outputs.run_frontend_dependency_audit == 'true' || needs.scope-router.outputs.run_full_dependency_audit == 'true'
        run: |
          echo "CI_CACHE package=npm hit=${{ steps.npm-setup.outputs.cache-hit }}"
          echo "CI_CACHE package=npm path=$(npm config get cache)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: dependency-audit
      - name: Run shared full dependency audit group
        if: needs.scope-router.outputs.run_full_dependency_audit == 'true'
        run: python scripts/ci_contract.py run-group dependency-audit
      - name: Run shared frontend dependency audit group
        if: needs.scope-router.outputs.run_frontend_dependency_audit == 'true' && needs.scope-router.outputs.run_full_dependency_audit != 'true'
        run: python scripts/ci_contract.py run-group frontend-dependency-audit
      - name: Run shared Python dependency audit group
        if: needs.scope-router.outputs.run_python_dependency_audit == 'true' && needs.scope-router.outputs.run_full_dependency_audit != 'true'
        run: python scripts/ci_contract.py run-group python-dependency-audit

  critical-smoke:
    name: Critical application smoke
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_critical_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            bot/requirements.txt
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          cache-suffix: critical-smoke
      - name: Install application runtime dependencies
        run: uv pip install -r backend/requirements-runtime.txt -r bot/requirements.txt
      - name: Run shared critical smoke group
        run: python scripts/ci_contract.py run-group critical-smoke

  workflow-contracts:
    name: Workflow contracts
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_workflow_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate shared CI contract
        if: needs.scope-router.outputs.run_workflow_config == 'true'
        run: python scripts/ci_contract.py run-group workflow-config
      - name: Validate image contract
        if: needs.scope-router.outputs.run_image_contract == 'true'
        run: python scripts/ci_contract.py run-group image-contract
      - name: Validate deployment contract
        if: needs.scope-router.outputs.run_deployment_contract == 'true'
        run: python scripts/ci_contract.py run-group deployment-contract

  containers:
    name: Container (${{ matrix.image }})
    needs: scope-router
    if: needs.scope-router.result == 'success' && needs.scope-router.outputs.run_containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
            no_cache: false
          - image: bot
            context: bot
            dockerfile: bot/Dockerfile
            # Keep the bot image fail-closed until shared COPY-cache provenance is proven.
            no_cache: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run shared container contract group
        run: python scripts/ci_contract.py run-group container-contract
      - uses: docker/setup-buildx-action@v4
      - name: Resolve immutable image reference
        id: image
        env:
          IMAGE_KIND: ${{ matrix.image }}
        run: python scripts/deployment_contract.py refs --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --kind "$IMAGE_KIND" >> "$GITHUB_OUTPUT"
      - name: Build and scan production image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.image.outputs.local_tag }}
          no-cache: ${{ matrix.no_cache }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify bot runtime image contract
        if: matrix.image == 'bot'
        shell: bash
        env:
          LOCAL_TAG: ${{ steps.image.outputs.local_tag }}
        run: |
          docker run --rm --network none \
            --env TELEGRAM_BOT_TOKEN=ci-image-contract-token \
            --env BOT_INTERNAL_TOKEN=ci-image-contract-internal-token \
            "$LOCAL_TAG" \
            python -c "import fitminiapp_bot.profile_sync; import fitminiapp_bot.public_profile; import fitminiapp_bot.telegram_client"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          image-ref: ${{ steps.image.outputs.local_tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          LOCAL_TAG: ${{ steps.image.outputs.local_tag }}
          PUBLISHED_REF: ${{ steps.image.outputs.image_ref }}
        run: docker tag "$LOCAL_TAG" "$PUBLISHED_REF" && docker push "$PUBLISHED_REF"

  scheduled-report:
    name: Private scheduled Allure report
    concurrency:
      group: yfc-scheduled-allure-publication
      cancel-in-progress: false
    needs:
      [scope-router, frontend, frontend-smoke, frontend-mobile-regression, frontend-mobile-regression-extended, frontend-cross-browser, python-tests, migrated-stack]
    if: always() && needs.scope-router.result == 'success' && needs.scope-router.outputs.run_scheduled_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      RUN_KIND: ${{ needs.scope-router.outputs.profile == 'weekly-exhaustive' && 'weekly' || 'daily' }}
      REPORT_TIER: ${{ needs.scope-router.outputs.profile }}
      RUN_STARTED_AT: ${{ github.run_started_at }}
      TEST_RESULTS_JSON: >-
        {"frontend":"${{ needs.frontend.result }}","frontend-smoke":"${{ needs.frontend-smoke.result }}","frontend-mobile-regression":"${{ needs.frontend-mobile-regression.result }}","frontend-mobile-regression-extended":"${{ needs.frontend-mobile-regression-extended.result }}","frontend-cross-browser":"${{ needs.frontend-cross-browser.result }}","python-tests":"${{ needs.python-tests.result }}","migrated-stack":"${{ needs.migrated-stack.result }}"}
      BUNDLE_DOWNLOAD_ROOT: ${{ github.workspace }}/.artifacts/runtime/tests/downloaded-allure
      BUNDLE_DECRYPTED_ROOT: ${{ github.workspace }}/.artifacts/runtime/tests/decrypted-allure
      MERGED_RESULTS_ROOT: ${{ github.workspace }}/.artifacts/runtime/tests/allure-results-merged
      REPORT_ROOT: ${{ github.workspace }}/.artifacts/runtime/tests/allure-report
      REPORT_METADATA: ${{ github.workspace }}/.artifacts/runtime/tests/allure-report-metadata.json
      PUBLICATION_METADATA: ${{ github.workspace }}/.artifacts/runtime/tests/allure-publication.json
      ALLURE_REPORT_SSH_HOST: ${{ vars.ALLURE_REPORT_SSH_HOST || 'app.your-fitness-coach.ru' }}
      ALLURE_REPORT_SSH_PORT: ${{ vars.ALLURE_REPORT_SSH_PORT || '22' }}
      ALLURE_REPORT_SSH_USER: ${{ vars.ALLURE_REPORT_SSH_USER || 'yfc-allure-publisher' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install report and adapter dependencies
        working-directory: frontend
        run: |
          npm ci
          npm ci --prefix scheduled-report --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Download encrypted Allure bundles
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-${{ github.run_id }}-*
          path: .artifacts/runtime/tests/downloaded-allure
          merge-multiple: true
      - name: Decrypt only current-run result bundles
        if: always()
        continue-on-error: true
        env:
          ALLURE_REPORT_ENCRYPTION_KEY: ${{ secrets.ALLURE_REPORT_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BUNDLE_DOWNLOAD_ROOT" "$BUNDLE_DECRYPTED_ROOT"
          shopt -s nullglob
          bundles=("$BUNDLE_DOWNLOAD_ROOT"/*.enc)
          if [ "${#bundles[@]}" -eq 0 ]; then
            printf '%s\n' 'No encrypted Allure bundles were downloaded' > "$BUNDLE_DECRYPTED_ROOT/decrypt-failed.txt"
          fi
          for bundle in "${bundles[@]}"; do
            filename="${bundle##*/}"
            stem="${filename%.enc}"
            if ! python scripts/allure_bundle.py decrypt \
              --source "$bundle" \
              --output "$BUNDLE_DECRYPTED_ROOT/$stem"; then
              printf '%s\n' "$stem" >> "$BUNDLE_DECRYPTED_ROOT/decrypt-failed.txt"
            fi
          done
      - name: Aggregate and enrich Allure results
        if: always()
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          duration_seconds="$(python - "$RUN_STARTED_AT" <<'PY'
          from datetime import UTC, datetime
          import sys

          value = sys.argv[1].strip()
          if not value:
              print("0")
          else:
              started = datetime.fromisoformat(value.replace("Z", "+00:00"))
              print(max(0.0, (datetime.now(UTC) - started.astimezone(UTC)).total_seconds()))
          PY
          )"
          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          python scripts/allure_report.py aggregate \
            --bundle-root "$BUNDLE_DECRYPTED_ROOT" \
            --output-root "$MERGED_RESULTS_ROOT" \
            --metadata "$REPORT_METADATA" \
            --run-kind "$RUN_KIND" \
            --tier "$REPORT_TIER" \
            --run-id "${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --commit-sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --operating-system "ubuntu-latest" \
            --python-version "3.14" \
            --node-version "24" \
            --playwright-version "$playwright_version" \
            --duration-seconds "$duration_seconds"
      - name: Generate Allure HTML
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: ./scheduled-report/node_modules/.bin/allure generate "$MERGED_RESULTS_ROOT" -o "$REPORT_ROOT" --clean
      - name: Validate generated report and privacy boundary
        if: always()
        continue-on-error: true
        run: python scripts/allure_report.py validate --report-root "$REPORT_ROOT" --metadata "$REPORT_METADATA"
      - name: Publish private report to isolated VPS origin
        if: always()
        continue-on-error: true
        env:
          ALLURE_REPORT_SSH_PRIVATE_KEY: ${{ secrets.ALLURE_REPORT_SSH_PRIVATE_KEY }}
          ALLURE_REPORT_SSH_KNOWN_HOSTS: ${{ secrets.ALLURE_REPORT_SSH_KNOWN_HOSTS }}
        run: |
          python scripts/publish_allure_report.py publish \
            --report-root "$REPORT_ROOT" \
            --metadata "$REPORT_METADATA" \
            --publication "$PUBLICATION_METADATA"
      - name: Write scheduled report summary
        if: always()
        continue-on-error: true
        run: |
          python scripts/allure_report.py summary \
            --metadata "$REPORT_METADATA" \
            --publication "$PUBLICATION_METADATA" \
            --test-results "$TEST_RESULTS_JSON" \
            --output "$GITHUB_STEP_SUMMARY"
      - name: Require complete private publication
        if: always()
        run: python scripts/allure_report.py finalize --metadata "$REPORT_METADATA" --publication "$PUBLICATION_METADATA"

  checks:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && 'checks' || 'branch-checks' }}
    if: always()
    needs:
      [scope-router, task-provenance, review-contract, merge-provenance, quality, policy, frontend, frontend-smoke, frontend-mobile-regression, frontend-mobile-regression-extended, frontend-cross-browser, python-tests, migrated-stack, dependency-audit, containers, critical-smoke, workflow-contracts, scheduled-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify required result set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROFILE: ${{ needs.scope-router.outputs.profile }}
          EXPECTED_JOBS: ${{ needs.scope-router.outputs.required_jobs }}
          REQUIRED_GROUPS: ${{ needs.scope-router.outputs.required_groups }}
          SKIPPED_GROUPS: ${{ needs.scope-router.outputs.skipped_groups }}
          SCOPE_ROUTER_RESULT: ${{ needs.scope-router.result }}
          TASK_PROVENANCE_RESULT: ${{ needs.task-provenance.result }}
          REVIEW_CONTRACT_RESULT: ${{ needs.review-contract.result }}
          MERGE_PROVENANCE_RESULT: ${{ needs.merge-provenance.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_SMOKE_RESULT: ${{ needs.frontend-smoke.result }}
          FRONTEND_MOBILE_REGRESSION_RESULT: ${{ needs.frontend-mobile-regression.result }}
          FRONTEND_MOBILE_REGRESSION_EXTENDED_RESULT: ${{ needs.frontend-mobile-regression-extended.result }}
          FRONTEND_CROSS_BROWSER_RESULT: ${{ needs.frontend-cross-browser.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          MIGRATED_STACK_RESULT: ${{ needs.migrated-stack.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          CRITICAL_SMOKE_RESULT: ${{ needs.critical-smoke.result }}
          WORKFLOW_CONTRACTS_RESULT: ${{ needs.workflow-contracts.result }}
          SCHEDULED_REPORT_RESULT: ${{ needs.scheduled-report.result }}
        run: |
          set -Eeuo pipefail
          test "$SCOPE_ROUTER_RESULT" = success
          test -n "$EXPECTED_JOBS"
          echo "CI_RESULT_PROFILE=$PROFILE"
          echo "CI_RESULT_REQUIRED_GROUPS=$REQUIRED_GROUPS"
          echo "CI_RESULT_SKIPPED_GROUPS=$SKIPPED_GROUPS"
          RESULTS_JSON="$(python - <<'PY'
          import json
          import os

          result_names = (
              "scope-router",
              "task-provenance",
              "review-contract",
              "merge-provenance",
              "quality",
              "policy",
              "frontend",
              "frontend-smoke",
              "frontend-mobile-regression",
              "frontend-mobile-regression-extended",
              "frontend-cross-browser",
              "python-tests",
              "migrated-stack",
              "dependency-audit",
              "containers",
              "critical-smoke",
              "workflow-contracts",
              "scheduled-report",
          )
          env_names = {
              name: name.upper().replace("-", "_") + "_RESULT"
              for name in result_names
          }
          print(json.dumps({name: os.environ[env_name] for name, env_name in env_names.items()}))
          PY
          )"
          python scripts/ci_contract.py verify-results \
            --expected-jobs "$EXPECTED_JOBS" \
            --results-json "$RESULTS_JSON"
