name: Issue 960 temporary Prettier fix
on:
  push:
    branches:
      - codex/issue-960-rest-implementation
    paths:
      - .github/workflows/issue-960-prettier-temporary.yml

permissions:
  contents: write

jobs:
  prettier-once:
    if: github.event.head_commit.message != 'ci-autoformat-960'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/issue-960-rest-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Format changed #960 frontend files
        run: |
          npx prettier --write \
            src/features/workouts/restSessions.ts \
            src/features/workouts/TodayWorkout.tsx \
            src/features/workouts/WorkoutHistory.tsx \
            tests/e2e/active-workout-experience.spec.ts \
            tests/unit/features/workouts/RestSessions.test.ts \
            tests/unit/features/workouts/RestSyncJournal.test.ts
        working-directory: frontend
      - name: Commit exact formatter changes to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/workouts/restSessions.ts frontend/src/features/workouts/TodayWorkout.tsx frontend/src/features/workouts/WorkoutHistory.tsx frontend/tests/e2e/active-workout-experience.spec.ts frontend/tests/unit/features/workouts/RestSessions.test.ts frontend/tests/unit/features/workouts/RestSyncJournal.test.ts
          if git diff --cached --quiet; then
            echo "No formatting needed."
          else
            git commit -m "ci-autoformat-960"
            git push origin HEAD:codex/issue-960-rest-implementation
          fi
