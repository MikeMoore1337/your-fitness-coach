name: Issue 960 temporary master synchronization
on:
  push:
    branches: [codex/issue-960-rest-implementation]
    paths:
      - .github/workflows/issue-960-sync-temporary.yml
permissions:
  contents: write
jobs:
  sync-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: codex/issue-960-rest-implementation
      - name: Merge current master into isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-ff origin/master -m "chore(#960): sync current master into rest feature"
          git push origin HEAD:codex/issue-960-rest-implementation
