name: Release production

on:
  # A successful CI run on protected master is the normal production release entry point.
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the current master revision or roll back the active release
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      revision:
        description: Exact current master SHA (deploy) or active production SHA (rollback)
        required: true
        type: string
      ci_run_id:
        description: Successful post-merge CI run ID for a manual deployment
        required: false
        type: string
      reason:
        description: Owner-authorized reason for a manual deployment or rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize tested master revision
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.revision != '' && inputs.reason != '' &&
      (inputs.operation == 'rollback' || inputs.ci_run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.provenance.outputs.deploy }}
      reason: ${{ steps.provenance.outputs.reason }}
      operation: ${{ steps.provenance.outputs.operation }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}
      DEPLOY_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact successful CI evidence
        if: env.DEPLOY_OPERATION == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          ci_run="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID")"
          printf '%s\n' "$ci_run"
          jq -e \
            --arg sha "$DEPLOY_SHA" \
            --argjson run_id "$CI_RUN_ID" \
            '(.id == $run_id) and
             (.name == "CI") and
             (.head_sha == $sha) and
             (.event == "push") and
             (.head_branch == "master") and
             (.status == "completed") and
             (.conclusion == "success")' \
            <<<"$ci_run" >/dev/null

      - name: Verify master revision and derive deployment scope from Git
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          echo "operation=$DEPLOY_OPERATION" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_OPERATION" = rollback ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=owner-authorized rollback of the active production revision" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_master="$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          test "$current_master" = "$DEPLOY_SHA"
          base_sha="$(git rev-parse "$DEPLOY_SHA^1")"
          scope="$(python scripts/deployment_scope.py \
            --base "$base_sha" \
            --head "$DEPLOY_SHA" \
            --json)"
          printf '%s\n' "$scope"
          deploy="$(jq -r '.deploy_required | if type == "boolean" then tostring else empty end' <<<"$scope")"
          reason="$(jq -r '.reasons[0] // empty' <<<"$scope")"
          test -n "$deploy" -a -n "$reason"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Authorized current master revision $DEPLOY_SHA: $reason"

  deploy:
    name: Deploy immutable tested bundle
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
      PROD_ROLLOUT_MODE: single-slot
    steps:
      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check out exact merge revision on the runner
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Resolve immutable application image references
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          backend_ref="$(python scripts/deployment_contract.py refs --repository "$REPOSITORY" --revision "$DEPLOY_SHA" --kind backend | sed -n 's/^image_ref=//p')"
          bot_ref="$(python scripts/deployment_contract.py refs --repository "$REPOSITORY" --revision "$DEPLOY_SHA" --kind bot | sed -n 's/^image_ref=//p')"
          test -n "$backend_ref" -a -n "$bot_ref"
          echo "backend_image_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "bot_image_ref=$bot_ref" >> "$GITHUB_OUTPUT"

      - name: Read the active deployed revision and create migration manifest
        id: migration
        run: |
          set -Eeuo pipefail
          ACTIVE_REVISION=""
          for attempt in 1 2 3; do
            if ACTIVE_REVISION="$(ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -p "$PROD_PORT" \
              "$PROD_USER@$PROD_HOST" \
              "set -Eeuo pipefail
            marker='$PROD_PATH/.artifacts/operations/deployments/last-successful-revision'
            if [ -f \"\$marker\" ]; then
              cat \"\$marker\"
              exit 0
            fi
            # Legacy single-slot deployments may retain evidence without the marker file.
            state_root='$PROD_PATH/.artifacts/operations/deployments'
            if [ -d \"\$state_root\" ]; then
              latest_summary=\"\$(
                find \"\$state_root\" -mindepth 2 -maxdepth 2 -type f -name summary.json -printf '%T@ %p\\n' |
                  sort -nr |
                  cut -d' ' -f2- |
                  while IFS= read -r summary; do
                    revision=\"\$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding=\"utf-8\")); print(value.get(\"target_revision\", \"\") if value.get(\"verdict\") == \"active\" else \"\")' \"\$summary\")\"
                    if [[ \"\$revision\" =~ ^[0-9a-f]{40}$ ]]; then
                      printf '%s\\n' \"\$revision\"
                      break
                    fi
                  done
              )\"
              if [ -n \"\$latest_summary\" ]; then
                printf '%s\\n' \"\$latest_summary\"
                exit 0
              fi
            fi
            container_for_service() {
              local service=\"\$1\"
              local containers
              containers=\$(docker ps --filter \"label=com.docker.compose.service=\$service\" --format '{{.ID}}')
              test \"\$(printf '%s\\n' \"\$containers\" | sed '/^$/d' | wc -l)\" -eq 1
              printf '%s\\n' \"\$containers\"
            }
            backend_container=\$(container_for_service backend)
            bot_container=\$(container_for_service bot)
            backend_image=\$(docker inspect --format '{{.Config.Image}}' \"\$backend_container\")
            bot_image=\$(docker inspect --format '{{.Config.Image}}' \"\$bot_container\")
            backend_revision=\$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \"\$backend_image\")
            bot_revision=\$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \"\$bot_image\")
            test \"\$backend_revision\" = \"\$bot_revision\"
            printf '%s\\n' \"\$backend_revision\"
          ")"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to read active production revision after 3 SSH attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Active revision SSH read attempt $attempt failed; retrying in $delay seconds" >&2
            sleep "$delay"
          done
          if [[ ! "$ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production active revision is missing or not a full lowercase SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ACTIVE_REVISION" "$DEPLOY_SHA"; then
            echo "Production active revision $ACTIVE_REVISION is not an ancestor of $DEPLOY_SHA" >&2
            exit 1
          fi
          python scripts/check_online_migrations.py \
            "$ACTIVE_REVISION" "$DEPLOY_SHA" \
            --write-manifest --output deployment-migration-manifest.json
          echo "active_revision=$ACTIVE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Build immutable deployment bundle
        id: bundle
        run: |
          set -Eeuo pipefail
          bundle_tar="yfc-deploy-$DEPLOY_SHA.tar"
          bundle_name="$bundle_tar.gz"
          git archive --format=tar --output="$bundle_tar" "$DEPLOY_SHA" backend/alembic/versions docker-compose.yml deploy scripts
          tar --append --file="$bundle_tar" deployment-migration-manifest.json
          gzip -n "$bundle_tar"
          echo "name=$bundle_name" >> "$GITHUB_OUTPUT"

      - name: Transfer immutable bundle to production
        run: |
          set -Eeuo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$PROD_PORT" \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 \
            "${{ steps.bundle.outputs.name }}" \
            "$PROD_USER@$PROD_HOST:/tmp/${{ steps.bundle.outputs.name }}"

      - name: Deploy bundle with exact provenance and deployment evidence
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image_ref }}
          BOT_IMAGE: ${{ steps.images.outputs.bot_image_ref }}
          ACTIVE_REVISION: ${{ steps.migration.outputs.active_revision }}
        run: |
          set -Eeuo pipefail
          test -n "$GHCR_TOKEN"
          # The refs came from the authoritative deployment contract step above.
          test -n "$BACKEND_IMAGE" -a -n "$BOT_IMAGE"
          test -n "$ACTIVE_REVISION"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             IFS= read -r GHCR_TOKEN
             RELEASE_ROOT='$PROD_PATH/releases'
             RELEASE_PATH=\"\$RELEASE_ROOT/$DEPLOY_SHA\"
             STAGING_PATH=\"\$RELEASE_ROOT/.staging-$DEPLOY_SHA-${{ github.run_id }}\"
             mkdir -p \"\$RELEASE_ROOT\" \"\$STAGING_PATH\"
             tar -xzf '/tmp/$BUNDLE_NAME' -C \"\$STAGING_PATH\"
             printf '%s\\n' '$DEPLOY_SHA' > \"\$STAGING_PATH/.deployment-sha\"
             test -f '$PROD_PATH/.env'
             install -m 600 '$PROD_PATH/.env' \"\$STAGING_PATH/.env\"
             if [ -e \"\$RELEASE_PATH/.deployment-sha\" ]; then
               test \"\$(cat \"\$RELEASE_PATH/.deployment-sha\")\" = '$DEPLOY_SHA'
               rm -rf \"\$STAGING_PATH\"
             else
               mv \"\$STAGING_PATH\" \"\$RELEASE_PATH\"
             fi
             cd \"\$RELEASE_PATH\"
             # Keep the project name stable while the compose file moves between immutable releases.
             export COMPOSE_PROJECT_NAME=fit-mini-app
             export DEPLOY_ROOT=\"\$RELEASE_PATH\"
             export DEPLOY_STATE_ROOT='$PROD_PATH/.artifacts/operations/deployments'
             export DEPLOY_ARTIFACT_ROOT='$PROD_PATH/.artifacts'
             export DEPLOY_MIGRATION_MANIFEST=deployment-migration-manifest.json
             export DEPLOY_SINGLE_SLOT_CONFIRMED_SHA='$DEPLOY_SHA'
             active_marker='$PROD_PATH/.artifacts/operations/deployments/last-successful-revision'
             if [ -f \"\$active_marker\" ]; then
               test \"\$(tr -d '\\r\\n' < \"\$active_marker\")\" = '$ACTIVE_REVISION'
             else
               install -d -m 700 \"\$(dirname \"\$active_marker\")\"
               printf '%s\\n' '$ACTIVE_REVISION' > \"\$active_marker\"
             fi
             registry_login_succeeded=false
             DOCKER_CONFIG_DIR=\$(mktemp -d)
             trap 'rm -rf \"\$DOCKER_CONFIG_DIR\"' EXIT
             export DOCKER_CONFIG=\"\$DOCKER_CONFIG_DIR\"
             for attempt in 1 2 3 4 5; do
               if printf '%s' \"\$GHCR_TOKEN\" | docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; then
                 registry_login_succeeded=true
                 break
               fi
               if [ \"\$attempt\" -eq 5 ]; then break; fi
               delay=\$((attempt * 10))
               echo \"GHCR login attempt \$attempt failed; retrying in \$delay seconds\" >&2
               sleep \"\$delay\"
             done
             if [ \"\$registry_login_succeeded\" != true ]; then
               echo 'GHCR login failed after 5 attempts' >&2
               exit 1
             fi
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             BOT_IMAGE='$BOT_IMAGE' \
             bash scripts/deploy_production.sh '$DEPLOY_SHA' '$PROD_URL' '$PROD_PUBLIC_URL' '$PROD_ROLLOUT_MODE'
             install -m 600 \"\$RELEASE_PATH/.env\" '$PROD_PATH/.env'
             ln -sfn \"\$RELEASE_PATH\" '$PROD_PATH/current'
             python3 \"\$RELEASE_PATH/scripts/production_host_cleanup.py\" '$DEPLOY_SHA' \
               --app-root '$PROD_PATH' \
               --backup-keep 5 \
               --previous-releases 2 \
               --tmp-root /tmp \
               --warning-free-mb 3072 \
               --stale-ttl-hours 24 \
               --docker-prune
              rm -f '/tmp/$BUNDLE_NAME'"

  rollback:
    name: Roll back known production release
    needs: authorize
    if: needs.authorize.outputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    env:
      ACTIVE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '' }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
    steps:
      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Roll back and run production smoke
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             marker='$PROD_PATH/.artifacts/operations/deployments/last-successful-revision'
             test -f \"\$marker\"
             test \"\$(tr -d '\\r\\n' < \"\$marker\")\" = '$ACTIVE_REVISION'
             test -L '$PROD_PATH/current'
             cd '$PROD_PATH/current'
             set -a
             . '$PROD_PATH/.env'
             set +a
             test -n \"\${BACKEND_IMAGE:-}\" -a -n \"\${BOT_IMAGE:-}\"
             DEPLOY_STATE_ROOT='$PROD_PATH/.artifacts/operations/deployments' \
             python3 scripts/zero_downtime_deploy.py rollback '$ACTIVE_REVISION' '$PROD_URL' '$PROD_PUBLIC_URL'"
