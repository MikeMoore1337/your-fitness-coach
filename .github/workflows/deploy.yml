name: Release production

on:
  # A successful CI run on protected master is the normal production release entry point.
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, repair, verify, reconcile metadata, or roll back production
        required: true
        default: deploy
        type: choice
        options: [deploy, repair, verify, reconcile, rollback]
      revision:
        description: Expected production SHA for verify; exact tested SHA for deploy/repair/reconcile; active SHA for rollback
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID for manual deploy, repair, or provenance reconciliation
        required: false
        type: string
      reason:
        description: Owner-authorized reason for a manual deployment, repair, or rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize tested master revision
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.revision != '' && inputs.reason != '' &&
      (inputs.operation == 'rollback' || inputs.operation == 'verify' || inputs.ci_run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.provenance.outputs.deploy }}
      reason: ${{ steps.provenance.outputs.reason }}
      operation: ${{ steps.provenance.outputs.operation }}
      current_master: ${{ steps.provenance.outputs.current_master }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}
      DEPLOY_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.operation == 'verify' && 'master' || env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact successful CI evidence
        if: env.DEPLOY_OPERATION == 'deploy' || env.DEPLOY_OPERATION == 'repair' || env.DEPLOY_OPERATION == 'reconcile'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          ci_run="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID")"
          printf '%s\n' "$ci_run"
          jq -e \
            --arg sha "$DEPLOY_SHA" \
            --argjson run_id "$CI_RUN_ID" \
            '(.id == $run_id) and
             (.name == "CI") and
             (.head_sha == $sha) and
             (.event == "push") and
             (.head_branch == "master") and
             (.status == "completed") and
             (.conclusion == "success")' \
            <<<"$ci_run" >/dev/null

      - name: Verify master revision and derive deployment scope from Git
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          echo "operation=$DEPLOY_OPERATION" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_OPERATION" = rollback ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=owner-authorized rollback of the active production revision" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_master="$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          git fetch origin master --no-tags
          test "$(git rev-parse origin/master)" = "$current_master"
          echo "current_master=$current_master" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_OPERATION" = verify ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=owner-authorized read-only production provenance verification" >> "$GITHUB_OUTPUT"
            echo "Authorized read-only production verification against expected revision $DEPLOY_SHA"
            exit 0
          fi
          if [ "$DEPLOY_OPERATION" = reconcile ]; then
            git merge-base --is-ancestor "$DEPLOY_SHA" "$current_master"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=owner-authorized metadata-only production provenance reconciliation" >> "$GITHUB_OUTPUT"
            echo "Authorized provenance reconciliation for tested ancestor $DEPLOY_SHA"
            exit 0
          fi
          if [ "$DEPLOY_OPERATION" = repair ]; then
            git merge-base --is-ancestor "$DEPLOY_SHA" "$current_master"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=owner-authorized repair of an interrupted production release" >> "$GITHUB_OUTPUT"
            echo "Authorized production repair for tested ancestor $DEPLOY_SHA"
            exit 0
          fi
          test "$current_master" = "$DEPLOY_SHA"
          base_sha="$(git rev-parse "$DEPLOY_SHA^1")"
          scope="$(python scripts/deployment_scope.py \
            --base "$base_sha" \
            --head "$DEPLOY_SHA" \
            --json)"
          printf '%s\n' "$scope"
          deploy="$(jq -r '.deploy_required | if type == "boolean" then tostring else empty end' <<<"$scope")"
          reason="$(jq -r '.reasons[0] // empty' <<<"$scope")"
          test -n "$deploy" -a -n "$reason"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Authorized current master revision $DEPLOY_SHA: $reason"

  deploy:
    name: Deploy immutable tested bundle
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
      PROD_ROLLOUT_MODE: single-slot
    steps:
      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check out exact merge revision on the runner
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Resolve immutable application image references
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          backend_ref="$(python scripts/deployment_contract.py refs --repository "$REPOSITORY" --revision "$DEPLOY_SHA" --kind backend | sed -n 's/^image_ref=//p')"
          bot_ref="$(python scripts/deployment_contract.py refs --repository "$REPOSITORY" --revision "$DEPLOY_SHA" --kind bot | sed -n 's/^image_ref=//p')"
          test -n "$backend_ref" -a -n "$bot_ref"
          echo "backend_image_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "bot_image_ref=$bot_ref" >> "$GITHUB_OUTPUT"

      - name: Read the active deployed revision and create migration manifest
        id: migration
        run: |
          set -Eeuo pipefail
          ACTIVE_REVISION=""
          ACTIVE_AUDIT=""
          for attempt in 1 2 3; do
            if ACTIVE_REVISION="$(ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -p "$PROD_PORT" \
              "$PROD_USER@$PROD_HOST" \
              "python3 - snapshot --app-root '$PROD_PATH'" \
              < scripts/production_provenance.py)"; then
              ACTIVE_AUDIT="$ACTIVE_REVISION"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to read active production revision after 3 SSH attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Active revision SSH read attempt $attempt failed; retrying in $delay seconds" >&2
            sleep "$delay"
          done
          if [ -z "$ACTIVE_AUDIT" ]; then
            echo "Production provenance audit returned no result" >&2
            exit 1
          fi
          status="$(jq -r '.status // empty' <<<"$ACTIVE_REVISION")"
          recorded_revision="$(jq -r '.recorded_revision // empty' <<<"$ACTIVE_REVISION")"
          runtime_revision="$(jq -r '.runtime_revision // empty' <<<"$ACTIVE_REVISION")"
          if [ "$status" != OK ]; then
            echo "Production provenance preflight failed: status=$status recorded=$recorded_revision runtime=$runtime_revision" >&2
            printf '%s\n' "$ACTIVE_REVISION" >&2
            exit 1
          fi
          if [ "$recorded_revision" != "$runtime_revision" ]; then
            echo "Production provenance mismatch before transfer: recorded=$recorded_revision runtime=$runtime_revision" >&2
            exit 1
          fi
          ACTIVE_REVISION="$runtime_revision"
          if [[ ! "$ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production runtime revision is missing or not a full lowercase SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ACTIVE_REVISION" "$DEPLOY_SHA"; then
            echo "Production active revision $ACTIVE_REVISION is not an ancestor of $DEPLOY_SHA" >&2
            exit 1
          fi
          python scripts/check_online_migrations.py \
            "$ACTIVE_REVISION" "$DEPLOY_SHA" \
            --write-manifest --output deployment-migration-manifest.json
          echo "active_revision=$ACTIVE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Build immutable deployment bundle
        id: bundle
        run: |
          set -Eeuo pipefail
          bundle_tar="yfc-deploy-$DEPLOY_SHA.tar"
          bundle_name="$bundle_tar.gz"
          git archive --format=tar --output="$bundle_tar" "$DEPLOY_SHA" backend/alembic/versions docker-compose.yml deploy scripts
          tar --append --file="$bundle_tar" deployment-migration-manifest.json
          gzip -n "$bundle_tar"
          echo "name=$bundle_name" >> "$GITHUB_OUTPUT"

      - name: Transfer immutable bundle to production
        run: |
          set -Eeuo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$PROD_PORT" \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 \
            "${{ steps.bundle.outputs.name }}" \
            "$PROD_USER@$PROD_HOST:/tmp/${{ steps.bundle.outputs.name }}"

      - name: Deploy bundle with exact provenance and deployment evidence
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image_ref }}
          BOT_IMAGE: ${{ steps.images.outputs.bot_image_ref }}
          ACTIVE_REVISION: ${{ steps.migration.outputs.active_revision }}
        run: |
          set -Eeuo pipefail
          test -n "$GHCR_TOKEN"
          # The refs came from the authoritative deployment contract step above.
          test -n "$BACKEND_IMAGE" -a -n "$BOT_IMAGE"
          test -n "$ACTIVE_REVISION"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             IFS= read -r GHCR_TOKEN
             RELEASE_ROOT='$PROD_PATH/releases'
             RELEASE_PATH=\"\$RELEASE_ROOT/$DEPLOY_SHA\"
             STAGING_PATH=\"\$RELEASE_ROOT/.staging-$DEPLOY_SHA-${{ github.run_id }}\"
             mkdir -p \"\$RELEASE_ROOT\" \"\$STAGING_PATH\"
             tar -xzf '/tmp/$BUNDLE_NAME' -C \"\$STAGING_PATH\"
             printf '%s\\n' '$DEPLOY_SHA' > \"\$STAGING_PATH/.deployment-sha\"
             test -f '$PROD_PATH/.env'
             install -m 600 '$PROD_PATH/.env' \"\$STAGING_PATH/.env\"
             if [ -e \"\$RELEASE_PATH/.deployment-sha\" ]; then
               test \"\$(cat \"\$RELEASE_PATH/.deployment-sha\")\" = '$DEPLOY_SHA'
               rm -rf \"\$STAGING_PATH\"
             else
               mv \"\$STAGING_PATH\" \"\$RELEASE_PATH\"
             fi
             cd \"\$RELEASE_PATH\"
             # Keep the project name stable while the compose file moves between immutable releases.
             export COMPOSE_PROJECT_NAME=fit-mini-app
             export DEPLOY_ROOT=\"\$RELEASE_PATH\"
             export DEPLOY_STATE_ROOT='$PROD_PATH/.artifacts/operations/deployments'
             export DEPLOY_ARTIFACT_ROOT='$PROD_PATH/.artifacts'
             export DEPLOY_MIGRATION_MANIFEST=deployment-migration-manifest.json
             export DEPLOY_SINGLE_SLOT_CONFIRMED_SHA='$DEPLOY_SHA'
             active_marker='$PROD_PATH/.artifacts/operations/deployments/last-successful-revision'
             test -f \"\$active_marker\"
             test \"\$(tr -d '\\r\\n' < \"\$active_marker\")\" = '$ACTIVE_REVISION'
             registry_login_succeeded=false
             DOCKER_CONFIG_DIR=\$(mktemp -d)
             trap 'rm -rf \"\$DOCKER_CONFIG_DIR\"' EXIT
             export DOCKER_CONFIG=\"\$DOCKER_CONFIG_DIR\"
             for attempt in 1 2 3 4 5; do
               if printf '%s' \"\$GHCR_TOKEN\" | docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; then
                 registry_login_succeeded=true
                 break
               fi
               if [ \"\$attempt\" -eq 5 ]; then break; fi
               delay=\$((attempt * 10))
               echo \"GHCR login attempt \$attempt failed; retrying in \$delay seconds\" >&2
               sleep \"\$delay\"
             done
             if [ \"\$registry_login_succeeded\" != true ]; then
               echo 'GHCR login failed after 5 attempts' >&2
               exit 1
             fi
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             BOT_IMAGE='$BOT_IMAGE' \
             bash scripts/deploy_production.sh '$DEPLOY_SHA' '$PROD_URL' '$PROD_PUBLIC_URL' '$PROD_ROLLOUT_MODE'
             install -m 600 \"\$RELEASE_PATH/.env\" '$PROD_PATH/.env'
             ln -sfn \"\$RELEASE_PATH\" '$PROD_PATH/current'
             python3 \"\$RELEASE_PATH/scripts/production_host_cleanup.py\" '$DEPLOY_SHA' \
               --app-root '$PROD_PATH' \
               --backup-keep 5 \
               --previous-releases 2 \
               --tmp-root /tmp \
               --warning-free-mb 3072 \
               --stale-ttl-hours 24 \
              --docker-prune
              rm -f '/tmp/$BUNDLE_NAME'"

  repair:
    name: Repair known production release
    needs: authorize
    if: needs.authorize.outputs.operation == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      REVISION: ${{ inputs.revision }}
      BASELINE_REVISION: 050bbd3f80aac0b8e84389fa3c4c28875df89066
      TOOLING_REVISION: ${{ needs.authorize.outputs.current_master }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
      PROD_ROLLOUT_MODE: single-slot
    steps:
      - name: Check out current deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.current_master }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current deployment tooling revision
        run: |
          set -Eeuo pipefail
          [[ "$TOOLING_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TOOLING_REVISION"
          echo "REPAIR_TOOLING_REVISION=$TOOLING_REVISION"

      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve immutable target image references
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          backend_ref="$(python scripts/deployment_contract.py refs --repository "$REPOSITORY" --revision "$REVISION" --kind backend | sed -n 's/^image_ref=//p')"
          bot_ref="$(python scripts/deployment_contract.py refs --repository "$REPOSITORY" --revision "$REVISION" --kind bot | sed -n 's/^image_ref=//p')"
          test -n "$backend_ref" -a -n "$bot_ref"
          echo "backend_image_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "bot_image_ref=$bot_ref" >> "$GITHUB_OUTPUT"

      - name: Verify target images and OCI provenance before transfer
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image_ref }}
          BOT_IMAGE: ${{ steps.images.outputs.bot_image_ref }}
        run: |
          set -Eeuo pipefail
          test -n "$GHCR_TOKEN"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          for image in "$BACKEND_IMAGE" "$BOT_IMAGE"; do
            docker pull "$image"
            revision_label="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$revision_label" = "$REVISION"
            image_id="$(docker image inspect "$image" --format '{{.Id}}')"
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            digest="$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n 1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "Verified immutable image: ${image%@*}@$digest revision=$revision_label"
          done

      - name: Verify migration safety from durable baseline
        run: |
          set -Eeuo pipefail
          python scripts/check_online_migrations.py \
            "$BASELINE_REVISION" "$REVISION" \
            --write-manifest --output deployment-migration-manifest.json
          cat deployment-migration-manifest.json

      - name: Read-only production repair preflight
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "python3 - snapshot --app-root '$PROD_PATH'" \
            < scripts/production_provenance.py | tee provenance-before.json
          jq -e \
            --arg baseline "$BASELINE_REVISION" \
            --arg current "$PROD_PATH/releases/$BASELINE_REVISION" \
            '(.recorded_revision == $baseline) and
             (.current.target == $current) and
             (.runtime_uniform == false) and
             (.status == "INVALID_RUNTIME" or .status == "MIXED_RUNTIME")' \
            provenance-before.json >/dev/null
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             test -f '$PROD_PATH/releases/$BASELINE_REVISION/.deployment-sha'
             test \"\$(tr -d '\\r\\n' < '$PROD_PATH/releases/$BASELINE_REVISION/.deployment-sha')\" = '$BASELINE_REVISION'
             export COMPOSE_PROJECT_NAME=fit-mini-app
             cd '$PROD_PATH/current'
             docker compose exec -T backend alembic current
             printf '%s\\n' '---HEADS---'
             docker compose exec -T backend alembic heads" | tee db-before.txt
          python - <<'PY'
          from pathlib import Path

          from scripts.production_provenance import (
              alembic_revisions_are_consistent,
              parse_alembic_revisions,
          )

          current_text, heads_text = Path("db-before.txt").read_text(encoding="utf-8").split(
              "---HEADS---", 1
          )
          current = parse_alembic_revisions(current_text)
          heads = parse_alembic_revisions(heads_text)
          if not alembic_revisions_are_consistent(current, heads):
              raise SystemExit(
                  f"database migration state is not a known head: current={sorted(current)} heads={sorted(heads)}"
              )
          print(f"DB_CURRENT_REVISIONS={','.join(sorted(current))}")
          print(f"DB_HEAD_REVISIONS={','.join(sorted(heads))}")
          PY
          echo "PRE_REPAIR_AUDIT=PASS"

      - name: Build immutable repair bundle with current delivery tooling
        id: bundle
        run: |
          set -Eeuo pipefail
          bundle_root="$(mktemp -d)"
          git archive --format=tar "$REVISION" backend/alembic/versions docker-compose.yml deploy scripts | tar -xf - -C "$bundle_root"
          tooling_paths=(
            scripts/deploy_production.sh
            scripts/zero_downtime_deploy.py
            scripts/production_host_cleanup.py
            scripts/configure_production_auth.py
            scripts/configure_production_food_search.py
            scripts/normalize_production_news_image_provider.py
            scripts/configure_production_ai_coach.py
            scripts/configure_production_nutrition_label_scan.py
            scripts/configure_production_log_retention.py
            scripts/check_online_migrations.py
            scripts/continuous_deployment_probe.py
            scripts/db_maintenance.py
            scripts/check_deployment.py
            scripts/check_seo_surface.py
          )
          git archive --format=tar "$TOOLING_REVISION" "${tooling_paths[@]}" | tar -xf - -C "$bundle_root"
          cp deployment-migration-manifest.json "$bundle_root/deployment-migration-manifest.json"
          bundle_tar="yfc-repair-$REVISION.tar"
          bundle_name="$bundle_tar.gz"
          tar --create --file="$bundle_tar" --directory="$bundle_root" .
          gzip -n "$bundle_tar"
          echo "name=$bundle_name" >> "$GITHUB_OUTPUT"

      - name: Transfer immutable repair bundle
        env:
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
        run: |
          set -Eeuo pipefail
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -P "$PROD_PORT" \
            "$BUNDLE_NAME" \
            "$PROD_USER@$PROD_HOST:/tmp/$BUNDLE_NAME"

      - name: Run existing single-slot deployment mechanism for repair
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image_ref }}
          BOT_IMAGE: ${{ steps.images.outputs.bot_image_ref }}
          TOOLING_REVISION: ${{ needs.authorize.outputs.current_master }}
        run: |
          set -Eeuo pipefail
          test -n "$GHCR_TOKEN"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             IFS= read -r GHCR_TOKEN
             RELEASE_ROOT='$PROD_PATH/releases'
             RELEASE_PATH=\"\$RELEASE_ROOT/$REVISION\"
             STAGING_PATH=\"\$RELEASE_ROOT/.staging-repair-$REVISION-${{ github.run_id }}\"
             QUARANTINE_PATH=\"\$RELEASE_ROOT/.quarantine-repair-$REVISION-${{ github.run_id }}\"
             mkdir -p \"\$RELEASE_ROOT\"
             test ! -e \"\$STAGING_PATH\"
             install -d -m 700 \"\$STAGING_PATH\"
             tar -xzf '/tmp/$BUNDLE_NAME' -C \"\$STAGING_PATH\"
             printf '%s\\n' '$REVISION' > \"\$STAGING_PATH/.deployment-sha\"
             test -f '$PROD_PATH/.env'
             install -m 600 '$PROD_PATH/.env' \"\$STAGING_PATH/.env\"
             current_target=\"\$(readlink -f '$PROD_PATH/current' 2>/dev/null || true)\"
             test \"\$current_target\" = \"\$RELEASE_ROOT/$BASELINE_REVISION\"
             if [ -e \"\$RELEASE_PATH\" ] || [ -L \"\$RELEASE_PATH\" ]; then
               test -f \"\$RELEASE_PATH/.deployment-sha\"
               test \"\$(cat \"\$RELEASE_PATH/.deployment-sha\")\" = '$REVISION'
             fi
             echo 'REPAIR_TARGET_REVISION=$REVISION'
             echo 'REPAIR_TOOLING_REVISION=$TOOLING_REVISION'
             echo \"REPAIR_EXECUTION_ROOT=\$STAGING_PATH\"
             cd \"\$STAGING_PATH\"
             export COMPOSE_PROJECT_NAME=fit-mini-app
             export DEPLOY_ROOT=\"\$STAGING_PATH\"
             export DEPLOY_STATE_ROOT='$PROD_PATH/.artifacts/operations/deployments'
             export DEPLOY_ARTIFACT_ROOT='$PROD_PATH/.artifacts'
             export DEPLOY_MIGRATION_MANIFEST=deployment-migration-manifest.json
             export DEPLOY_SINGLE_SLOT_CONFIRMED_SHA='$REVISION'
             export DEPLOY_REPAIR_MODE=true
             export DEPLOY_REPAIR_BASELINE_SHA='$BASELINE_REVISION'
             active_marker='$PROD_PATH/.artifacts/operations/deployments/last-successful-revision'
             test -f \"\$active_marker\"
             test \"\$(tr -d '\\r\\n' < \"\$active_marker\")\" = '$BASELINE_REVISION'
             registry_login_succeeded=false
             DOCKER_CONFIG_DIR=\$(mktemp -d)
             trap 'rm -rf \"\$DOCKER_CONFIG_DIR\"' EXIT
             export DOCKER_CONFIG=\"\$DOCKER_CONFIG_DIR\"
             for attempt in 1 2 3 4 5; do
               if printf '%s' \"\$GHCR_TOKEN\" | docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; then
                 registry_login_succeeded=true
                 break
               fi
               if [ \"\$attempt\" -eq 5 ]; then break; fi
               delay=\$((attempt * 10))
               echo \"GHCR login attempt \$attempt failed; retrying in \$delay seconds\" >&2
               sleep \"\$delay\"
             done
             if [ \"\$registry_login_succeeded\" != true ]; then
               echo 'GHCR login failed after 5 attempts' >&2
               exit 1
             fi
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             BOT_IMAGE='$BOT_IMAGE' \
             bash scripts/deploy_production.sh '$REVISION' '$PROD_URL' '$PROD_PUBLIC_URL' '$PROD_ROLLOUT_MODE'
             test \"\$(tr -d '\\r\\n' < \"\$active_marker\")\" = '$REVISION'
             current_target=\"\$(readlink -f '$PROD_PATH/current' 2>/dev/null || true)\"
             test \"\$current_target\" = \"\$RELEASE_ROOT/$BASELINE_REVISION\"
             test ! -e \"\$QUARANTINE_PATH\"
             if [ -e \"\$RELEASE_PATH\" ] || [ -L \"\$RELEASE_PATH\" ]; then
               mv \"\$RELEASE_PATH\" \"\$QUARANTINE_PATH\"
             fi
             mv \"\$STAGING_PATH\" \"\$RELEASE_PATH\"
             install -m 600 \"\$RELEASE_PATH/.env\" '$PROD_PATH/.env'
             ln -sfn \"\$RELEASE_PATH\" '$PROD_PATH/current'
             python3 \"\$RELEASE_PATH/scripts/production_host_cleanup.py\" '$REVISION' \
               --app-root '$PROD_PATH' \
               --backup-keep 5 \
               --previous-releases 2 \
               --tmp-root /tmp \
               --warning-free-mb 3072 \
               --docker-prune
             rm -f '/tmp/$BUNDLE_NAME'"

      - name: Verify repaired production provenance
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "python3 - snapshot --app-root '$PROD_PATH'" \
            < scripts/production_provenance.py | tee provenance-after.json
          jq -e \
            --arg expected "$REVISION" \
            --arg current "$PROD_PATH/releases/$REVISION" \
            '(.status == "OK") and
             (.recorded_revision == $expected) and
             (.runtime_revision == $expected) and
             (.runtime_uniform == true) and
             (.current.target == $current) and
             (.release.exists_and_matches == true) and
             (.database.consistent == true) and
             ((.errors | length) == 0) and
             (.services.backend.revision == $expected) and
             (.services.backend.health == "healthy") and
             (.services.worker.revision == $expected) and
             (.services.worker.health == "healthy") and
             (.services.bot.revision == $expected) and
             (.services.bot.status == "running") and
             (.services.bot.runtime_markers.polling_file_lock_acquired == true) and
             (.services.bot.runtime_markers.telegram_polling_started == true) and
             (any(.summaries[]?; .target_revision == $expected and .verdict == "active"))' \
            provenance-after.json >/dev/null

      - name: Verify repaired application and SEO smoke
        run: |
          set -Eeuo pipefail
          python scripts/check_deployment.py "$PROD_URL" --expected-environment prod
          python scripts/check_seo_surface.py "$PROD_PUBLIC_URL" --timeout 15
          echo "REPAIR_COMPLETED=true"

  verify:
    name: Verify production provenance (read-only)
    needs: authorize
    if: needs.authorize.outputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    env:
      REVISION: ${{ inputs.revision }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
    steps:
      - name: Check out current tested verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.current_master }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only production provenance verification
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "python3 - verify --app-root '$PROD_PATH' --expected-revision '$REVISION'" \
            < scripts/production_provenance.py | tee provenance-verify.json
          jq -e \
            --arg expected "$REVISION" \
            --arg current "$PROD_PATH/releases/$REVISION" \
            '(.status == "VERIFIED") and
             (.recorded_revision == $expected) and
             (.runtime_revision == $expected) and
             (.runtime_uniform == true) and
             (.current.target == $current) and
             (.release.exists_and_matches == true) and
             (.database.consistent == true) and
             ((.errors | length) == 0) and
             (.services.backend.revision == $expected) and
             (.services.backend.health == "healthy") and
             (.services.backend.immutable_image == true) and
             ((.services.backend.image_ref | type) == "string" and (.services.backend.image_ref | contains("@sha256:"))) and
             (.services.worker.revision == $expected) and
             (.services.worker.health == "healthy") and
             (.services.worker.immutable_image == true) and
             ((.services.worker.image_ref | type) == "string" and (.services.worker.image_ref | contains("@sha256:"))) and
             (.services.bot.revision == $expected) and
             (.services.bot.status == "running") and
             (.services.bot.immutable_image == true) and
             ((.services.bot.image_ref | type) == "string" and (.services.bot.image_ref | contains("@sha256:"))) and
             (.services.bot.runtime_markers.polling_file_lock_acquired == true) and
             (.services.bot.runtime_markers.telegram_polling_started == true) and
             (any(.summaries[]?; .target_revision == $expected and .verdict == "active"))' \
            provenance-verify.json >/dev/null

      - name: Verify public application and SEO smoke (read-only)
        run: |
          set -Eeuo pipefail
          python scripts/check_deployment.py "$PROD_URL" --expected-environment prod
          python scripts/check_seo_surface.py "$PROD_PUBLIC_URL" --timeout 15
          echo "VERIFY_MUTATION=false"

  reconcile:
    name: Reconcile verified production provenance metadata
    needs: authorize
    if: needs.authorize.outputs.operation == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    environment: production
    env:
      REVISION: ${{ inputs.revision }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
    steps:
      - name: Check out current reconciliation helper
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only production provenance audit
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "python3 - snapshot --app-root '$PROD_PATH'" \
            < scripts/production_provenance.py | tee provenance-before.json
          jq -e \
            --arg expected "$REVISION" \
            '(.runtime_revision == $expected) and
             (.runtime_uniform == true) and
             ((.services | keys | sort) == ["backend", "bot", "worker"]) and
             ((.errors | length) == 0) and
             (.status == "OK" or .status == "PROVENANCE_RECONCILIATION_REQUIRED") and
             (.recorded_revision | test("^[0-9a-f]{40}$"))' \
            provenance-before.json >/dev/null

      - name: Verify public application and SEO smoke before metadata change
        run: |
          set -Eeuo pipefail
          python scripts/check_deployment.py "$PROD_URL" --expected-environment prod
          python scripts/check_seo_surface.py "$PROD_PUBLIC_URL" --timeout 15

      - name: Reconcile marker and current symlink without application mutation
        run: |
          set -Eeuo pipefail
          result="$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "python3 - reconcile --app-root '$PROD_PATH' --expected-revision '$REVISION'" \
            < scripts/production_provenance.py)"
          printf '%s\n' "$result" | tee provenance-reconcile.json
          jq -e \
            --arg expected "$REVISION" \
            '(.status == "RECONCILED") and
             (.application_mutation == false) and
             (.post_marker == $expected)' \
            provenance-reconcile.json >/dev/null
          echo "RECONCILIATION=PASS"
          echo "RECONCILIATION_APPLICATION_MUTATION=false"

      - name: Verify reconciled production provenance
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "python3 - snapshot --app-root '$PROD_PATH'" \
            < scripts/production_provenance.py | tee provenance-after.json
          jq -e \
            --arg expected "$REVISION" \
            '(.status == "OK") and
             (.recorded_revision == $expected) and
             (.runtime_revision == $expected) and
             (.runtime_uniform == true) and
             (.current.target == .release.path) and
             ((.errors | length) == 0)' \
            provenance-after.json >/dev/null

      - name: Verify public application and SEO smoke after metadata change
        run: |
          set -Eeuo pipefail
          python scripts/check_deployment.py "$PROD_URL" --expected-environment prod
          python scripts/check_seo_surface.py "$PROD_PUBLIC_URL" --timeout 15

  rollback:
    name: Roll back known production release
    needs: authorize
    if: needs.authorize.outputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    env:
      ACTIVE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '' }}
      PROD_HOST: 77.91.90.171
      PROD_PORT: "1337"
      PROD_USER: yfc-deploy
      PROD_PATH: /srv/yfc/fit-mini-app
      PROD_URL: https://app.your-fitness-coach.ru
      PROD_PUBLIC_URL: https://your-fitness-coach.ru
    steps:
      - name: Configure production SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Roll back and run production smoke
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "set -Eeuo pipefail
             marker='$PROD_PATH/.artifacts/operations/deployments/last-successful-revision'
             test -f \"\$marker\"
             test \"\$(tr -d '\\r\\n' < \"\$marker\")\" = '$ACTIVE_REVISION'
             test -L '$PROD_PATH/current'
             cd '$PROD_PATH/current'
             set -a
             . '$PROD_PATH/.env'
             set +a
             test -n \"\${BACKEND_IMAGE:-}\" -a -n \"\${BOT_IMAGE:-}\"
             DEPLOY_STATE_ROOT='$PROD_PATH/.artifacts/operations/deployments' \
             python3 scripts/zero_downtime_deploy.py rollback '$ACTIVE_REVISION' '$PROD_URL' '$PROD_PUBLIC_URL'"
