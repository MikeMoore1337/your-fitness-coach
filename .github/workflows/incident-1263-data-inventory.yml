name: Incident 1263 - live data and backup inventory (read-only)

on:
  pull_request:
    paths:
      - .github/workflows/incident-1263-data-inventory.yml
      - scripts/incident_1263_data_inventory.py
  push:
    branches: [master]
    paths:
      - .github/workflows/incident-1263-data-inventory.yml

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/incident_1263_data_inventory.py

  inventory:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18
    steps:
      - name: Enforce owner protected master and no external inputs
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Configure existing pinned production SSH identity
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inventory only sanitized metadata from existing PostgreSQL and backups
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -p 1337 yfc-deploy@77.91.90.171 \
            "python3 -" < scripts/incident_1263_data_inventory.py | tee inventory.json
          jq -e '.task == "1263-data-recovery" and .mode == "read_only" and .application_mutation == false and .database_mutation == false and .data_transferred == false' inventory.json >/dev/null
          echo 'INCIDENT_1263_SANITIZED_DATA_INVENTORY=PASS'
