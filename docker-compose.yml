x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-yfc-backend:local}
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      VITE_PWA_ENABLED: ${VITE_PWA_ENABLED:-true}

x-bot-image: &bot-image
  image: ${BOT_IMAGE:-yfc-bot:local}
  build: ./bot

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORWARDED_ALLOW_IPS: 172.29.0.3
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)\"",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
      default:
      app_edge:
        ipv4_address: 172.29.0.2

  backend-blue:
    <<: *backend-image
    image: ${BACKEND_BLUE_IMAGE:-yfc-backend:local}
    restart: unless-stopped
    profiles: ["production-slots"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORWARDED_ALLOW_IPS: 172.29.0.3
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)\"",
        ]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: ${DEPLOY_BACKEND_DRAIN_SECONDS:-45s}
    networks:
      default:
      app_edge:

  backend-green:
    <<: *backend-image
    image: ${BACKEND_GREEN_IMAGE:-yfc-backend:local}
    restart: unless-stopped
    profiles: ["production-slots"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORWARDED_ALLOW_IPS: 172.29.0.3
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)\"",
        ]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s
      start_interval: 2s
    stop_grace_period: ${DEPLOY_BACKEND_DRAIN_SECONDS:-45s}
    networks:
      default:
      app_edge:

  setup:
    <<: *backend-image
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: /app/setup-entrypoint.sh

  bot:
    <<: *bot-image
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://app.your-fitness-coach.ru}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      APP_ENV: ${APP_ENV:-dev}
      BOT_POLLING_ENABLED: ${BOT_POLLING_ENABLED:-true}
      BOT_POLLING_LOCK_DIR: /var/lock/fitminiapp-bot
      BOT_CONFLICT_RETRY_SECONDS: ${BOT_CONFLICT_RETRY_SECONDS:-300}
      BOT_PROFILE_SYNC_STATE_PATH: ${BOT_PROFILE_SYNC_STATE_PATH:-/var/lock/fitminiapp-bot/profile-sync-state.json}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - bot_polling_lock:/var/lock/fitminiapp-bot

  edge:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/edge-entrypoint.sh"]
    environment:
      YFC_ACTIVE_UPSTREAM: ${YFC_ACTIVE_UPSTREAM:-backend:8000}
      YFC_ASSET_FALLBACK_UPSTREAM: ${YFC_ASSET_FALLBACK_UPSTREAM:-backend:8000}
    volumes:
      - ./deploy/Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - ./deploy/edge-entrypoint.sh:/usr/local/bin/edge-entrypoint.sh:ro
      - edge_config:/config
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      app_edge:
        ipv4_address: 172.29.0.3
      proxy_net:
        ipv4_address: 172.28.0.12

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    profiles: ["direct-https"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      # Optional for backward compatibility. When set, Caddy serves the same
      # backend on the public landing hostname as well as the app hostname.
      LANDING_DOMAIN: ${LANDING_DOMAIN:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${APP_DOMAIN:?APP_DOMAIN is required}"
        LANDING_CANONICAL="$${LANDING_DOMAIN#www.}"
        if [ -n "$${LANDING_CANONICAL}" ] && [ "$${LANDING_CANONICAL}" != "$${APP_DOMAIN}" ]; then
            SITE_ADDRESSES="$${APP_DOMAIN}, $${LANDING_CANONICAL}, www.$${LANDING_CANONICAL}"
        else
            SITE_ADDRESSES="$${APP_DOMAIN}"
        fi
        cat > /etc/caddy/Caddyfile <<EOF
        $${SITE_ADDRESSES} {
            encode zstd gzip

            header {
                Strict-Transport-Security "max-age=31536000; includeSubDomains"
                X-Content-Type-Options "nosniff"
                Referrer-Policy "strict-origin-when-cross-origin"
            }

            reverse_proxy edge:8080
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      edge:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy_net:
        ipv4_address: 172.28.0.10

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    profiles: ["cloudflare"]
    environment:
      # Keep the tunnel secret out of command arguments and process listings.
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      edge:
        condition: service_healthy
    networks:
      proxy_net:
        ipv4_address: 172.28.0.11

  allure-report-origin:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    profiles: ["allure-reports"]
    user: "${ALLURE_REPORT_ORIGIN_UID:-1501}:${ALLURE_REPORT_ORIGIN_GID:-1501}"
    mem_limit: ${ALLURE_REPORT_ORIGIN_MEMORY_LIMIT:-64m}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /srv/yfc-allure-reports:/srv/reports:ro
      - ./deploy/allure-report-origin/Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      allure_reports:

  cloudflared-allure:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    profiles: ["allure-reports"]
    mem_limit: ${ALLURE_CLOUDFLARED_MEMORY_LIMIT:-64m}
    environment:
      # This connector token belongs only to the Allure Tunnel and is not the
      # token used by the existing optional application tunnel.
      TUNNEL_TOKEN: ${ALLURE_CLOUDFLARED_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      allure-report-origin:
        condition: service_healthy
    networks:
      allure_reports:
      allure_egress:

  worker:
    <<: *backend-image
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    command: /app/worker-entrypoint.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time; from fitminiapp_api.core.config import settings; age=time.time()-os.path.getmtime('/tmp/fitminiapp-worker-heartbeat'); assert age < max(120, settings.worker_poll_seconds * 3 + 30)\"",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
      start_interval: 2s

  worker-blue:
    <<: *backend-image
    image: ${BACKEND_BLUE_IMAGE:-yfc-backend:local}
    restart: unless-stopped
    profiles: ["production-slots"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: /app/worker-entrypoint.sh
    stop_grace_period: ${DEPLOY_WORKER_DRAIN_SECONDS:-90s}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time; from fitminiapp_api.core.config import settings; age=time.time()-os.path.getmtime('/tmp/fitminiapp-worker-heartbeat'); assert age < max(120, settings.worker_poll_seconds * 3 + 30)\"",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
      start_interval: 2s

  worker-green:
    <<: *backend-image
    image: ${BACKEND_GREEN_IMAGE:-yfc-backend:local}
    restart: unless-stopped
    profiles: ["production-slots"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: /app/worker-entrypoint.sh
    stop_grace_period: ${DEPLOY_WORKER_DRAIN_SECONDS:-90s}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time; from fitminiapp_api.core.config import settings; age=time.time()-os.path.getmtime('/tmp/fitminiapp-worker-heartbeat'); assert age < max(120, settings.worker_poll_seconds * 3 + 30)\"",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
      start_interval: 2s

  bot-blue:
    <<: *bot-image
    image: ${BOT_BLUE_IMAGE:-yfc-bot:local}
    restart: unless-stopped
    profiles: ["production-slots"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://app.your-fitness-coach.ru}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      BACKEND_INTERNAL_URL: http://edge:8080
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      APP_ENV: ${APP_ENV:-dev}
      BOT_POLLING_ENABLED: ${BOT_POLLING_ENABLED:-true}
      BOT_POLLING_LOCK_DIR: /var/lock/fitminiapp-bot
      BOT_CONFLICT_RETRY_SECONDS: ${BOT_CONFLICT_RETRY_SECONDS:-300}
      BOT_PROFILE_SYNC_STATE_PATH: ${BOT_PROFILE_SYNC_STATE_PATH:-/var/lock/fitminiapp-bot/profile-sync-state.json}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
    stop_grace_period: ${DEPLOY_BOT_DRAIN_SECONDS:-45s}
    volumes:
      - bot_polling_lock:/var/lock/fitminiapp-bot
    networks:
      default:
      app_edge:

  bot-green:
    <<: *bot-image
    image: ${BOT_GREEN_IMAGE:-yfc-bot:local}
    restart: unless-stopped
    profiles: ["production-slots"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://app.your-fitness-coach.ru}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      BACKEND_INTERNAL_URL: http://edge:8080
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      APP_ENV: ${APP_ENV:-dev}
      BOT_POLLING_ENABLED: ${BOT_POLLING_ENABLED:-true}
      BOT_POLLING_LOCK_DIR: /var/lock/fitminiapp-bot
      BOT_CONFLICT_RETRY_SECONDS: ${BOT_CONFLICT_RETRY_SECONDS:-300}
      BOT_PROFILE_SYNC_STATE_PATH: ${BOT_PROFILE_SYNC_STATE_PATH:-/var/lock/fitminiapp-bot/profile-sync-state.json}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
    stop_grace_period: ${DEPLOY_BOT_DRAIN_SECONDS:-45s}
    volumes:
      - bot_polling_lock:/var/lock/fitminiapp-bot
    networks:
      default:
      app_edge:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  edge_config:
  bot_polling_lock:
    # The explicit name makes the lock shared by bot containers started from
    # different Compose projects on the same Docker host.
    name: fitminiapp_bot_polling_lock

networks:
  app_edge:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  proxy_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  allure_reports:
    internal: true
  allure_egress:
